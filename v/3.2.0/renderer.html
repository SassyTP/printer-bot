<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Second layer behind the sanitizer. If a message gets something through, the page still can't run it or send anything out.
     Only the renderer's own script (matched by hash) runs. Connections go only to the two avatar lookups. No frames, forms or objects. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-TjXX+aDvsmplvaFKqwRCPDI6hPXdhA6/dnaslUsoEFk='; style-src 'unsafe-inline'; img-src data: https://static-cdn.jtvnw.net https://files.kick.com https://cdn.betterttv.net https://cdn.7tv.app https://cdn.frankerfacez.com https://kick.com https://*.ggpht.com https://*.googleusercontent.com https://*.ytimg.com https://i.imgur.com https://files.catbox.moe https://i.ibb.co; connect-src https://decapi.me https://kick.com; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
<meta name="printer-bot-renderer" content="202610202210">
<style>
/*
 * Printer Bot receipt
 *
 * One typeface, two weights: bold for what matters (title, names, amounts), regular for everything else.
 * No italics and no mixed families. Everything is pure black on white, since thermal paper has no grey.
 *
 * To restyle your own receipts, put your CSS in theme.css next to settings.json.
 * It is applied on top of this file. The receipt is 272px wide (72mm), and sizes below are in em.
 */

html, body {
	margin: 0;
	padding: 0;
	background: #fff;
	overflow: hidden;      /* a scrollbar would steal layout width and print as a bar */
}

#receipt-container {
	box-sizing: border-box;
	/* No blank paper above the avatar. It used to be 16px (33.9 dots, 4.2 mm). Everything else keeps its place relative to the picture.
	   A receipt without a picture keeps the old margin, see .no-avatar below.
	   --pb-cut-h is the part of the bottom padding that a receipt with a picture gives back (see the larger picture below). */
	padding: 0 14px calc(14px - var(--pb-cut-h, 0px));
	font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
	font-size: 16px;
	font-weight: 400;
	font-style: normal;
	line-height: 1.35;
	text-align: center;
	color: #000;
	font-synthesis: none;  /* no synthesized bold or italic, real faces only */
}


/* A receipt with no picture (not sent, refused, or failed to load) has nothing at the top edge to sit against. It keeps the old margin. */
#receipt-container.no-avatar {
	padding-top: 16px;
}


/* ---- banner: artwork above the header (the Hype Train receipts) ------------------------ */

/* Empty and gone unless a receipt puts a picture in it. "art" is a picture across the receipt (the engine, a rail car, the caboose). "cap" is the
   conductor's cap: it sits on top of the avatar and overlaps its top edge, the way a hat sits on a head. The pictures are inline vector drawings
   in plain black and white, so they print as crisply as the text does. */
#receipt-banner {
	display: none;
}

#receipt-banner svg {
	display: block;
	width: 100%;
	height: auto;
}

#receipt-banner.art {
	display: block;
	margin: 4px 0 8px;
}

#receipt-banner.cap {
	position: relative;
	z-index: 2;
	display: block;
	width: 9em;
	margin: 4px auto 0;
}

#receipt-banner.cap + #receipt-header #receipt-avatar {
	margin-top: -26px;
}

#receipt-container.no-avatar #receipt-banner.cap {
	margin-bottom: 8px;
}

/* The tail is the same kind of slot at the very bottom of the receipt, under the date line. A drawing that goes there is the last thing printed, so it
   comes out of the printer at the end of the print (the rail car of a Hype Train). */
#receipt-tail {
	display: none;
}

#receipt-tail svg {
	display: block;
	width: 100%;
	height: auto;
}

#receipt-tail.art {
	display: block;
	margin: 18px 0 0;
}


/* ---- header: avatar, title, name --------------------------------------- */

/* The picture is 13.875em = 222 px = 470 dots = 58.8 mm across on 80 mm paper. It was 11.5em = 184 px = 390 dots = 48.7 mm. A receipt with a picture is
   not allowed to grow for that: renderer.js hands the 38 px back out of the gaps around the header and the footer, and sets the variables that start with
   --pb-cut- (a number of px per gap) on the receipt. A variable that is not set cuts nothing, so a receipt without a picture lays out as it always did.
   The size has a variable of its own, --pb-avatar, which theme.css can set (on :root, #receipt-container or #receipt-avatar). */
#receipt-avatar {
	display: block;
	box-sizing: border-box;
	width: min(var(--pb-avatar, 13.875em), 100%);
	height: auto;
	aspect-ratio: 1 / 1;
	margin: 0 auto calc(14px - var(--pb-cut-a, 0px));
	border: 3px solid #000;
	border-radius: 50%;
	object-fit: cover;
}

/* 58 mm paper is 181 px wide with 14 px of margin on each side, and the printer head covers all 181 px (48 mm). The picture may use --pb-avatar-bleed
   (10 px) of each margin, which leaves 4 px (1 mm) of white on each side, so the ring stays whole. It is 173 px = 367 dots = 45.9 mm there, and it was
   153 px = 40.6 mm. */
@media (max-width: 220px) {
	#receipt-avatar {
		width: calc(100% + 2 * var(--pb-avatar-bleed, 10px));
		margin-left: calc(-1 * var(--pb-avatar-bleed, 10px));
		margin-right: calc(-1 * var(--pb-avatar-bleed, 10px));
	}

	/* 3.2.0-beta.9: the receipt of an 80 mm roll on a sticker printer (sticker-fit, renderer.js stickerFit) is laid out 272 px wide in a page as narrow as the tape, which this rule
	   reads as 58 mm paper: it keeps the picture of the 80 mm roll. :where() leaves the rule as specific as the one above, so a theme's own picture size still wins, as on the roll. */
	:where(.sticker-fit) #receipt-avatar {
		width: min(var(--pb-avatar, 13.875em), 100%);
		margin-left: auto;
		margin-right: auto;
	}
}

#receipt-title {
	font-size: 1.35em;
	font-weight: 700;
	line-height: 1.15;
	letter-spacing: 0.06em;
	text-transform: uppercase;
}

/* amounts ($5.00, 100 BITS...) are the biggest text on the receipt */
#receipt-title.big {
	font-size: 2.2em;
	letter-spacing: 0.01em;
}

#receipt-subtitle {
	margin-top: 5px;
	font-size: 1.15em;
	font-weight: 700;
	line-height: 1.2;
}

#receipt-title:empty,
#receipt-subtitle:empty {
	display: none;
}


/* ---- dividers -------------------------------------------------------------- */

/* --pb-cut-above and --pb-cut-below are set on the rule under the header and on the footer (the rule in the footer takes them from there). They are 0 unless the
   receipt has a picture. */
.rule {
	margin: calc(16px - var(--pb-cut-above, 0px)) 0 calc(16px - var(--pb-cut-below, 0px));
	border-top: 2px solid #000;
}


/* ---- content ----------------------------------------------------------------- */

/* A hard box around whatever a viewer writes. It can't grow the receipt without limit or paint over the header
   or footer, and absolutely positioned content stays inside it. theme.css may raise max-height. */
#receipt-content {
	position: relative;
	overflow: hidden;
	contain: paint;
	max-height: 1600px;
}

/* A gift list (every recipient on its own line) and the item list of a paid order have no height limit at all: every name or item that arrives has to
   print, and 500 names is about 11,000 px. Only a handler sets this class, so event data cannot ask for it. The action photographs a page this tall in
   tiles. theme.css cannot bring the limit back with a plain "max-height" on #receipt-content, since the rule below is more specific. */
#receipt-content.roomy {
	max-height: none;
}

/* A list of names on a page of Letter paper (a gift list, the items of an order) is set in columns and a smaller type, as many as it takes to fit the page (fitNames in
   renderer.js sets the three variables on each page of the list). A roll has no such part: its list is one column. The plain step is the one column a roll has. */
.part.names {
	display: flow-root;
}

.part.names .names-page {
	column-count: var(--pb-cols, 1);
	column-gap: 0.6em;
	font-size: calc(1em * var(--pb-name-scale, 1));
	line-height: var(--pb-name-lh, inherit);
}

.part.names .nm {
	display: block;
	break-inside: avoid;
	overflow-wrap: anywhere;
}

/* What a buyer wrote with an order keeps the limit of a viewer's message, whatever the list above it holds. */
#receipt-content.roomy .part.message {
	max-height: 1600px;
	overflow: hidden;
}

/* a High Roller message cut off at its bits-per-inch limit fades out, so it doesn't stop mid-line.
   The printer dithers the fade into dots. */
#receipt-content.cut {
	-webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - min(40px, 35%)), transparent);
	mask-image: linear-gradient(to bottom, #000 calc(100% - min(40px, 35%)), transparent);
}

.part {
	margin: 0;
}

.part + .part {
	margin-top: 0.7em;
}

/* the one line that says what happened ("First time subscriber!", "42 months") */
.part.lead {
	font-size: 1.1em;
	font-weight: 700;
}

/* the facts of a subscription, one to a line. They are 5 percent smaller than the other parts so that the longest one, "Total time subscribed: 999 months",
   fits the 244 px of 80 mm paper (235 px at this size, 247 px at full size). They sit closer together than other parts. */
.part.stat {
	font-size: 0.95em;
}

.part.stat + .part.stat {
	margin-top: 0.25em;
}

/* what the viewer wrote */
.part.message::before { content: "\201C"; }
.part.message::after  { content: "\201D"; }

.part.left {
	text-align: left;
}

/* A name or word that is wider than the line is broken where the line ends, so the end of a long name stays on the paper. The title keeps its words whole:
   they are fixed text, and a word that only just fits (MEMBERSHIP on 58 mm paper) has to stay in one piece. A High Roller message (raw) keeps its own styling. */
#receipt-subtitle,
.part:not(.raw) {
	overflow-wrap: anywhere;
}

/* Viewer text can be bold, and italics are turned off so receipts don't mix styles.
   raw = a High Roller message, left exactly as the viewer wrote it. */
.part:not(.raw) i,
.part:not(.raw) em {
	font-style: normal;
}

/* Hype Train receipts: a label on the left and a figure on the right, one pair to a line. A long name is cut with an ellipsis. */
.part.rows {
	text-align: left;
}

.hype-row {
	display: flex;
	justify-content: space-between;
	align-items: baseline;
	gap: 0.6em;
}

.hype-row + .hype-row {
	margin-top: 0.15em;
}

.hype-row > span {
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}

.hype-row > b {
	flex: none;
}

.hype-head {
	margin: 0 0 0.3em;
	font-weight: 700;
	letter-spacing: 0.06em;
	text-align: center;
	text-transform: uppercase;
}

.hype-cap {
	display: inline-block;
	width: 1.9em;
	margin-right: 0.4em;
	vertical-align: -0.4em;
}

.hype-cap svg {
	display: block;
	width: 100%;
	height: auto;
}

img.emote,
img.bits {
	height: 1.3em;
	vertical-align: -0.28em;
}

/* A picture in a viewer's message (3.0.0-beta.9: a link to an image site that the streamer switched on in the dock). It is a block of its own, centered, and never wider than the
   paper. The tallest it prints is set on the element in px of paper (MAX_MESSAGE_IMAGE_INCHES), where the page knows the paper. */
img.msg-image {
	display: block;
	max-width: 100%;
	width: auto;
	height: auto;
	margin: 0.4em auto;
	object-fit: contain;
}

/* a message with a picture has no quotation marks around it: they would stand alone above and below the picture */
.part.message.pictures::before,
.part.message.pictures::after {
	content: none;
}


/* ---- footer: platform mark and date ----------------------------------------------- */

#receipt-footer {
	margin-top: calc(16px - var(--pb-cut-above, 0px));
}

#receipt-icon {
	display: block;
	height: 3em;
	max-width: 70%;
	margin: calc(14px - var(--pb-cut-below, 0px)) auto calc(10px - var(--pb-cut-g, 0px));
}

#receipt-icon:not([src]),
#receipt-icon[src=""] {
	display: none;
}

#receipt-date {
	font-size: 0.8em;
	font-weight: 400;
	letter-spacing: 0.1em;
	text-transform: uppercase;
}

/* 3.0.4: the line under a receipt that the dock's test print made from typed values (renderer.js, testMark) */
#receipt-test-mark {
	margin-top: 6px;
	font-size: 0.8em;
	font-weight: 700;
	letter-spacing: 0.3em;
	text-align: center;
}


/* ---- the layout "large message" of a page of Letter paper (3.0.0-beta.10) ---------------------------------------------------------------------------------------- */

/* renderer.js gives the receipt the class letter-message when the printer has this layout and the paper is Letter, and sets two variables on it: --pb-in (CSS px to the inch of the
   paper, about 53.3 on Letter) and --pb-page-h (the height of a page in CSS px). Sizes below are in inches of paper, so theme.css can change one of them without a calculation.
   The receipt is one page tall at least. The header is a small round picture at the top left (2.3 inches, the size it has on an 80 mm roll) with the amount, the name and the time
   beside it. The platform logo is at the bottom of the page, smaller than in the other layout. All the space between belongs to the message and its pictures. */
#receipt-container.letter-message {
	position: relative;       /* the box that the logos of the pages of a long list are placed in (3.0.2, .page-logo below) */
	display: flex;
	flex-direction: column;
	min-height: var(--pb-page-h, 533px);
	text-align: left;
}

/* A list that takes more than one page has the platform logo at the bottom of every page, not only the last (3.0.2). renderer.js (addPageLogos) makes a copy of the logo for each page and gives it
   its place and size in px, the place of the logo of the footer a page above. They are no part of the message. */
.letter-message > .page-logo {
	position: absolute;
	display: block;
	margin: 0;
	max-width: none;
	pointer-events: none;
}

.letter-message .rule {
	display: none;
}

.letter-message #receipt-banner {
	align-self: stretch;
}

.letter-message #receipt-header {
	display: grid;
	grid-template-columns: calc(2.3 * var(--pb-in, 53.333px)) minmax(0, 1fr);
	grid-template-rows: 1fr auto auto auto 1fr;      /* the lines of text sit in the middle rows, so they are centered beside the picture */
	column-gap: calc(0.25 * var(--pb-in, 53.333px));
}

.letter-message #receipt-avatar {
	grid-column: 1;
	grid-row: 1 / -1;
	width: 100%;
	margin: 0;
}

/* a receipt with no picture: the text starts at the left edge */
.letter-message.no-avatar #receipt-header {
	grid-template-columns: 0 minmax(0, 1fr);
	column-gap: 0;
}

.letter-message #receipt-title,
.letter-message #receipt-subtitle,
.letter-message #receipt-date {
	grid-column: 2;
	text-align: left;
}

.letter-message #receipt-title {
	grid-row: 2;
	font-size: 1em;
}

.letter-message #receipt-title.big {
	font-size: 1.6em;
}

.letter-message #receipt-subtitle {
	grid-row: 3;
	margin-top: 3px;
	font-size: 0.95em;
}

.letter-message #receipt-date {
	grid-row: 4;
	margin-top: 4px;
	font-size: 0.7em;
}

.letter-message #receipt-content {
	flex: 1 1 auto;
	margin-top: calc(0.2 * var(--pb-in, 53.333px));
}

.letter-message #receipt-footer {
	margin: auto 0 0;
	padding-top: calc(0.3 * var(--pb-in, 53.333px));
}

.letter-message #receipt-icon {
	height: calc(0.5 * var(--pb-in, 53.333px));
	margin: 0 auto;
}

/* The conductor's cap of a Hype Train receipt sits on the picture, so with a picture it goes to the left with it: as wide as two thirds of the picture, in the middle of it, and the picture
   goes up under it by the same share it does on a roll. Without a picture the cap stays in the middle of the page, as in the other layout. */
.letter-message:not(.no-avatar) #receipt-banner.cap {
	width: calc(1.5 * var(--pb-in, 53.333px));
	margin: 4px 0 0 calc(0.4 * var(--pb-in, 53.333px));
}

.letter-message:not(.no-avatar) #receipt-banner.cap + #receipt-header #receipt-avatar {
	margin-top: calc(-0.27 * var(--pb-in, 53.333px));
}

/* Pictures of a message in the large layout (3.0.0). A message with a picture gives the space the text leaves to the pictures: the box of the message and its part with pictures are
   flex columns, the text keeps its own height and each picture takes an equal share of the rest, at least three quarters of an inch tall and as wide as the page. What the picture does inside
   that space is the choice of the printer (renderer.js puts one of the classes fit-fill, fit-fit and fit-stretch on the receipt): fill covers the space and crops what sticks out,
   fit shows all of the picture with margins where its shape does not match, and stretch draws it to the size of the space. */
.letter-message #receipt-content:has(> .part.pictures) {
	display: flex;
	flex-direction: column;
}

.letter-message #receipt-content > .part.pictures {
	flex: 1 0 auto;
	display: flex;
	flex-direction: column;
}

/* Giant words (a High Roller message in a font of 300 px) take room from the pictures first and then give way: while the box has pictures, the parts of words may shrink below their
   height and are clipped, so the pictures keep their least size (three quarters of an inch each) and it is the words that are cut. renderer.js marks a part that was clipped (clipped) and
   it fades out at its bottom edge, in place of the fade of the whole box that would land on a picture. */
.letter-message #receipt-content:has(> .part.pictures) > .part:not(.pictures) {
	flex: 0 1 auto;
	min-height: 0;
	overflow: hidden;
}

.letter-message #receipt-content .part.clipped {
	-webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - min(40px, 35%)), transparent);
	mask-image: linear-gradient(to bottom, #000 calc(100% - min(40px, 35%)), transparent);
}

.letter-message img.msg-image {
	flex: 1 1 0;
	align-self: stretch;
	width: 100%;
	min-height: calc(0.75 * var(--pb-in, 53.333px));
	max-width: 100%;
	max-height: none;
	margin: 0.4em 0;
	object-position: center;
}

.letter-message.fit-fill img.msg-image {
	object-fit: cover;
}

.letter-message.fit-fit img.msg-image {
	object-fit: contain;
}

.letter-message.fit-stretch img.msg-image {
	object-fit: fill;
}


/* ---- the sticker layout of a Brother VC-500W (3.2.0) -------------------------------------------------------------------------------------------------------------------- */

/* renderer.js gives the receipt the class sticker when the printer is a sticker printer (the action sends layout "sticker") and the receipt is a High Roller message (every other
   receipt, sticker-fit since 3.2.0-beta.9, is the receipt of an 80 mm roll made as wide as the tape by renderer.js, stickerFit: it has no rule here), and sets --pb-w, the width of
   the tape in CSS px (189 on 50 mm tape, 94 on 25 mm). Every size below is a share of it,
   so the same sticker comes out on every tape, smaller or larger. The sticker comes out of the printer lengthwise, its top first, and reads upright as it comes out: the viewer's
   picture as a small circle at the left with the kind of the event, the amount and the name beside it in three small lines, then the date centred under them, the message in a
   thin frame, and then the pictures of the message, each as wide as the tape in its own orientation: the head takes as little as the words need, so the photo gets the tape.
   The sticker is as long as that takes.
   This is the owner's second design, of 17 October 2026, after the first stickers printed (the first ran the lines along the tape with the message upside down, which was too
   small on 25 mm tape); the orientations and sizes live here alone. */
#receipt-container.sticker {
	display: block;
	padding: calc(var(--pb-w, 189px) * 0.02);
	text-align: center;
}

.sticker .rule,
.sticker #receipt-banner,
.sticker #receipt-tail,
.sticker #receipt-footer {
	display: none;
}

/* the head, kept small so that the photo gets the tape: the viewer's picture at the left (a quarter of the width), beside it three lines of one small size: the kind of the
   event with the amount (renderer.js puts both into #receipt-kind and the amount's own line is hidden), the name, then the date and the time */
.sticker #receipt-header {
	display: grid;
	grid-template-columns: auto minmax(0, 1fr);
	grid-template-areas: "pic kind" "pic name" "pic date";
	column-gap: calc(var(--pb-w, 189px) * 0.03);
	row-gap: 0;
	align-items: center;
	justify-items: start;
	height: auto;
}

.sticker #receipt-avatar {
	grid-area: pic;
	width: calc(var(--pb-w, 189px) * 0.24);
	margin: 0;
	border-width: 2px;
	transform: none;
}

.sticker #receipt-title,
.sticker #receipt-title.big {
	display: none;
}

.sticker #receipt-subtitle,
.sticker #receipt-kind,
.sticker #receipt-date {
	display: block;
	writing-mode: horizontal-tb;
	margin: 0;
	max-height: none;
	max-width: 100%;
	overflow: hidden;
	line-height: 1.4;
	letter-spacing: 0.01em;
	text-align: left;
	text-transform: none;
	white-space: nowrap;
	text-overflow: ellipsis;
	font-size: calc(var(--pb-w, 189px) * 0.055);
	font-weight: 400;
}

.sticker #receipt-kind { grid-area: kind; font-weight: 700; white-space: normal; }      /* the kind and the amount wrap onto a second line on a narrow tape rather than be cut */
.sticker #receipt-subtitle { grid-area: name; }
.sticker #receipt-date { grid-area: date; }

/* the words of the message: a framed box across the tape, as tall as the words need, read like the rest */
.sticker #receipt-content {
	box-sizing: border-box;
	display: block;
	margin-top: calc(var(--pb-w, 189px) * 0.02);
	padding: calc(var(--pb-w, 189px) * 0.02) calc(var(--pb-w, 189px) * 0.03);
	border: 1px solid #000;
	font-size: calc(var(--pb-w, 189px) * 0.065);
	line-height: 1.25;
	text-align: center;
	transform: none;
	max-height: none !important;
	overflow: visible;
}

.sticker #receipt-content .part.message::before,
.sticker #receipt-content .part.message::after {
	content: none;
}

/* the pictures of the message, under the frame: each as wide as the tape, in its own orientation, one under the other (renderer.js stickerArrange) */
#receipt-sticker-pictures {
	display: block;
	width: 100%;
	margin-top: calc(var(--pb-w, 189px) * 0.02);
}

#receipt-sticker-pictures .sticker-pic {
	position: static;
	width: 100%;
	margin: 0 0 calc(var(--pb-w, 189px) * 0.02);
	overflow: visible;
	font-size: calc(var(--pb-w, 189px) * 0.065);     /* the words [image] of a picture that did not come */
}

#receipt-sticker-pictures img.msg-image {
	position: static;
	display: block;
	width: 100%;
	height: auto;
	margin: 0;
	max-width: 100%;
	max-height: none !important;
	object-fit: fill;
	transform: none;
}

/* ---- a card of 4 x 6 inches in landscape (3.2.0-beta.2) ---------------------------------------------------------------------------------------------------------------------- */

/* renderer.js gives a High Roller message on a card the class card (the action sends layout "card" for a printer on that paper), and sets --pb-w and --pb-h, the width and the height
   of the card in CSS px (400 and 257: 5.6 by 3.6 inches of paper). Every size below is a share of the width. The words of the message are in a narrow column at the left, under the
   viewer's picture, the kind of the event, the amount, the name and the date; the pictures of the message take the rest of the card, side by side, set as Image fit says (fit-fit,
   fit-fill, fit-stretch). A card with no picture (card-words) gives the message the place of the pictures, in larger type. renderer.js shrinks the words to fit (cardWords).
   Every other receipt on a card (card-fit) is the receipt of an 80 mm roll, which renderer.js makes as large as the card allows (cardFit): it has no rule here. */
#receipt-container.card {
	display: grid;
	grid-template-columns: 15% minmax(0, 1fr);
	grid-template-rows: auto minmax(0, 1fr);
	grid-template-areas: "head pics" "words pics";
	column-gap: calc(var(--pb-w, 400px) * 0.02);
	box-sizing: border-box;
	width: 100%;
	height: var(--pb-h, 257px);
	padding: 0;
	overflow: hidden;
	text-align: left;
}

.card .rule,
.card #receipt-banner,
.card #receipt-tail,
.card #receipt-footer {
	display: none;
}

/* the head: the viewer's picture as wide as the column, then the kind of the event, the amount, the name and the date, one under the other */
.card #receipt-header {
	grid-area: head;
	display: flex;
	flex-direction: column;
	align-items: stretch;
	gap: calc(var(--pb-w, 400px) * 0.004);
	min-width: 0;
	margin: 0;
	padding: 0;
	text-align: left;
}

.card #receipt-avatar {
	width: 100%;
	margin: 0 0 calc(var(--pb-w, 400px) * 0.008);
	border-width: 1px;
}

.card #receipt-kind,
.card #receipt-title,
.card #receipt-title.big,
.card #receipt-subtitle,
.card #receipt-date,
.card #receipt-test-mark {
	display: block;
	margin: 0;
	padding: 0;
	font-size: calc(var(--pb-w, 400px) * 0.021);
	font-weight: 400;
	line-height: 1.2;
	letter-spacing: 0;
	text-align: left;
	text-transform: none;
	white-space: normal;
	overflow-wrap: anywhere;
}

.card #receipt-kind,
.card #receipt-title,
.card #receipt-title.big {
	font-weight: 700;
}

/* the words of the message, under the head; they fill what the column has left */
.card #receipt-content {
	grid-area: words;
	min-width: 0;
	min-height: 0;
	max-width: none;
	margin: calc(var(--pb-w, 400px) * 0.01) 0 0;
	padding: 0;
	overflow: hidden;
	font-size: calc(var(--pb-w, 400px) * 0.024);
	line-height: 1.25;
	text-align: left;
}

/* the pictures of the message, side by side in the rest of the card, each as tall as the card */
.card #receipt-card-pictures {
	grid-area: pics;
	display: flex;
	flex-direction: row;
	gap: calc(var(--pb-w, 400px) * 0.01);
	min-width: 0;
	height: 100%;
}

.card .card-pic {
	flex: 1 1 0;
	min-width: 0;
	height: 100%;
	display: flex;
	align-items: center;
	justify-content: center;
	overflow: hidden;
	font-size: calc(var(--pb-w, 400px) * 0.024);      /* the words [image] of a picture that did not come */
}

.card .card-pic img.msg-image {
	display: block;
	width: 100%;
	height: 100%;
	max-width: none;
	max-height: none !important;
	margin: 0;
	object-fit: contain;
}

.card.fit-fill .card-pic img.msg-image {
	object-fit: cover;
}

.card.fit-stretch .card-pic img.msg-image {
	object-fit: fill;
}

/* a card with no picture: the message takes the place of the pictures, in larger type */
#receipt-container.card.card-words {
	grid-template-areas: "head words" "head words";
}

.card.card-words #receipt-content {
	margin: 0;
	font-size: calc(var(--pb-w, 400px) * 0.05);
}

/* 3.2.0-beta.2: the TEST mark of a test print at the end of a sticker (renderer.js, stickerArrange: a sticker shows no footer, where the mark is on a roll) */
.sticker #receipt-test-mark {
	margin: calc(var(--pb-w, 189px) * 0.02) 0 0;
	font-size: calc(var(--pb-w, 189px) * 0.055);
	text-align: center;
}

</style>
<style id="theme"></style>
</head>
<body>
<div id="receipt-container">
    <div id="receipt-banner"></div>
    <div id="receipt-header">
        <img id="receipt-avatar">
        <div id="receipt-title"></div>
        <div id="receipt-subtitle"></div>
    </div>
    <div id="receipt-rule-top" class="rule"></div>
    <div id="receipt-content"></div>
    <div id="receipt-footer">
        <div class="rule"></div>
        <img id="receipt-icon">
        <div id="receipt-date"></div>
    </div>
    <div id="receipt-tail"></div>
</div>

    const MAX_PLAIN_CHARS = 500;       // Twitch's own limit. Longer text is truncated
    const MAX_RICH_CHARS = 4000;       // High Roller HTML source
    const MAX_NODES = 400;             // nodes a High Roller message may create
    const MAX_DEPTH = 24;              // nesting depth
    const MAX_STYLE_PROPS = 40;
    const MAX_NAME_CHARS = 48;         // a viewer / donor / reward / level name. Longer is cut and ends in "…". (Twitch logins are at most 25 characters. Display names and tip names are free text)
    const MAX_VARIANTS = 50;           // line items of one Fourthwall order that are printed
    const NAMES_PER_PAGE = 100;        // gift recipients that fit the first page of Letter paper (set in columns, see fitNames): more names go on to the next page. In the large layout (3.0.2) the pages after the first hold as many as fit at the same size
    const MIN_PAGE_FIT = 0.3;          // a receipt on Letter paper that is still taller than its page after every cut is made smaller as a whole, down to this share of its size (Hype Train receipts need 0.45 to 0.6)
    const MAX_NAME_PAGES = 10;         // ... on at most this many pages (the action prints 10 in black and white and 5 in color): the list is cut at NAMES_PER_PAGE * this - 1 names, which take fewer pages since 3.0.2 (the pages after the first are fuller). Names beyond them are counted in the last line
    const MAX_VIEWER_IMAGE_PX = 64;   // a viewer's image in a High Roller message can't be shown larger than this (about 17 mm on paper)
    const MAX_DATA_IMAGE_CHARS = 2000; // base64 characters allowed in an inline (data:) image, enough for a tiny icon

    // A viewer's image must come from a platform's own emote CDN (https, no port, no credentials)
    // or be a tiny inline PNG / GIF / WebP. This also stops a message from making your computer request addresses on your own network.
    // Both lists are filled in when the page is built, from the same list that the page's CSP and Edge's host rules come
    // from. A leading '*.' means any subdomain. The bare domain does not match.
    const TRUSTED_IMAGE_HOSTS = ["static-cdn.jtvnw.net","files.kick.com","cdn.betterttv.net","cdn.7tv.app","cdn.frankerfacez.com"];     // images a viewer's High Roller message may show
    const AVATAR_HOSTS = ["static-cdn.jtvnw.net","files.kick.com","kick.com","*.ggpht.com","*.googleusercontent.com","*.ytimg.com"];           // avatars the platforms hand over

    const ALLOWED_TAGS = new Set(['div', 'span', 'p', 'br', 'hr', 'b', 'strong', 'i', 'em', 'u', 's', 'del', 'ins', 'small', 'sub', 'sup',
        'mark', 'code', 'pre', 'kbd', 'blockquote', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'ul', 'ol', 'li', 'center',
        'table', 'thead', 'tbody', 'tfoot', 'tr', 'td', 'th', 'caption', 'img']);

    const DROP_WITH_CONTENT = new Set(['script', 'style', 'iframe', 'frame', 'frameset', 'object', 'embed', 'applet', 'template',
        'noscript', 'noembed', 'noframes', 'title', 'head', 'textarea', 'select', 'option', 'audio', 'video', 'canvas', 'xmp',
        'plaintext', 'link', 'meta', 'base', 'svg', 'math', 'portal', 'dialog']);

    // (links and form controls). A <font> or <marquee> is harmless and would only make the log noisy.
    const NOTED_WHEN_UNWRAPPED = new Set(['a', 'area', 'map', 'form', 'input', 'button']);

    // list does nothing. Edge 154 expands `white-space` to white-space-collapse and text-wrap-mode, and `border-spacing` to -webkit-border-horizontal-spacing and
    // -webkit-border-vertical-spacing. Both shorthands stay listed for an engine that still hands them out, and their longhands are listed too. Every other
    // name here is a longhand. The bench group "High Roller styles" (renderer-hardening) walks every name on the list and names any that can no longer appear.
    const ALLOWED_CSS = new Set([
        'display', 'position', 'top', 'right', 'bottom', 'left', 'width', 'height', 'min-width', 'max-width', 'min-height', 'max-height',
        'box-sizing', 'overflow-x', 'overflow-y', 'float', 'clear', 'vertical-align', 'z-index',
        'margin-top', 'margin-right', 'margin-bottom', 'margin-left', 'padding-top', 'padding-right', 'padding-bottom', 'padding-left',
        'flex-direction', 'flex-wrap', 'justify-content', 'align-items', 'align-content', 'align-self', 'row-gap', 'column-gap',
        'flex-grow', 'flex-shrink', 'flex-basis', 'order',
        'color', 'font-family', 'font-size', 'font-weight', 'font-style', 'font-stretch', 'font-variant-caps', 'font-variant-numeric',
        'font-variant-ligatures', 'line-height', 'letter-spacing', 'word-spacing', 'text-align', 'text-decoration-line',
        'text-decoration-style', 'text-decoration-color', 'text-decoration-thickness', 'text-transform', 'text-indent',
        'white-space', 'white-space-collapse', 'text-wrap-mode', 'text-wrap-style', 'word-break', 'overflow-wrap', 'writing-mode', 'text-orientation', 'direction', 'unicode-bidi',
        'background-color', 'list-style-type', 'list-style-position', 'table-layout', 'border-collapse', 'border-spacing',
        '-webkit-border-horizontal-spacing', '-webkit-border-vertical-spacing',
        'border-top-width', 'border-right-width', 'border-bottom-width', 'border-left-width',
        'border-top-style', 'border-right-style', 'border-bottom-style', 'border-left-style',
        'border-top-color', 'border-right-color', 'border-bottom-color', 'border-left-color',
        'border-top-left-radius', 'border-top-right-radius', 'border-bottom-left-radius', 'border-bottom-right-radius',
        'transform', 'transform-origin', 'rotate', 'scale', 'translate',
    ]);
    const CSS_VALUE_ALLOWED = {
        position: ['static', 'relative', 'absolute'],            // fixed and sticky are excluded because they escape the receipt
        display: ['none', 'block', 'inline', 'inline-block', 'flex', 'inline-flex', 'grid', 'inline-grid', 'table', 'table-row', 'table-cell', 'list-item'],

        'white-space-collapse': ['initial', 'collapse', 'preserve', 'preserve-breaks', 'preserve-spaces', 'break-spaces'],

    };

    const CSS_VALUE_FORBIDDEN = /url\s*\(|expression|javascript|@import|image-set|\\|<|>|\bvar\s*\(|\battr\s*\(|\benv\s*\(|\belement\s*\(|binding|behavior|\/\*/i;
    const CSS_RISKY_FAMILY = /^(background|mask|filter|clip|cursor|content|list-style|behavior)/;

    // What was removed from the last message, so the Streamer.bot log can say that someone tried something
    const securityNotes = new Set();
    let violationCount = 0;
    const violationLog = [];
    document.addEventListener('securitypolicyviolation', (e) => {
        violationCount++; securityNotes.add('blocked by page policy');
        if (violationLog.length < 40) violationLog.push(e.violatedDirective + ' <- ' + String(e.blockedURI).slice(0, 60));
    });

    const CONTROL_CHARS = /[\x00-\x08\x0B\x0C\x0E-\x1F\x7F-\x9F]/g;

    function cleanText(value) {
        const s = String(value ?? '').replace(CONTROL_CHARS, '');
        const t = s.replace(BIDI_CONTROLS, '');
        if (t.length !== s.length) securityNotes.add('bidi characters');          // rare in normal text, so it gets a line in the log
        return t;
    }

    // Characters that print as nothing (or flip the reading direction) and only help a name pretend to be something else.
    // ZWJ and ZWNJ (U+200D / U+200C) are left alone because emoji sequences and Persian / Indic scripts need them.
    // (U+2028 / U+2029, the line and paragraph separators, are not listed here. They count as white space and become a space.)
    const INVISIBLE_IN_NAMES = new RegExp('[' + chr(0xAD, 0x61C, 0x115F, 0x1160, 0x200B, 0x200E, 0x200F, 0x2060, 0x2061, 0x2062, 0x2063, 0x2064, 0x3164, 0xFEFF, 0xFFA0) +
        String.fromCodePoint(0xE0000) + '-' + String.fromCodePoint(0xE007F) + ']', 'gu');
    let segmenter = null;
    function graphemes(s) {
        try { if (!segmenter && typeof Intl.Segmenter === 'function') segmenter = new Intl.Segmenter(undefined, { granularity: 'grapheme' }); } catch { segmenter = null; }
        return segmenter ? Array.from(segmenter.segment(s), x => x.segment) : Array.from(s);
    }

    // A name, amount or other short label from an event: one line, no invisible/bidi characters, at most 3 stacked combining marks
    // per letter ("zalgo" text), and at most `max` (default MAX_NAME_CHARS) characters (counted as what you see, so an emoji is one).
    function displayName(value, max) {
        const limit = max > 0 ? max : MAX_NAME_CHARS;
        let s = String(value ?? '');
        if (s.length > limit * 8) {                                    // don't walk a 20,000-character name
            s = s.slice(0, limit * 8);
            if (/[\uD800-\uDBFF]$/.test(s)) s = s.slice(0, -1);      // (don't cut a surrogate pair in half)
        }
        s = cleanText(s).replace(INVISIBLE_IN_NAMES, '').replace(/\s+/g, ' ').trim().replace(/(\p{M}{3})\p{M}+/gu, '$1');
        // A name that shows as nothing is empty, so the caller's own fallback (Anonymous supporter, the login) is used. That is a name of only joiners (ZWJ and
        // ZWNJ stay inside real names), only combining marks, or only Braille blanks (U+2800 counts as a symbol, so it is left out of this test).
        if (!/[\p{L}\p{N}\p{P}\p{S}]/u.test(s.replace(/\u2800/g, ''))) return '';
        const g = graphemes(s);
        return g.length > limit ? g.slice(0, limit).join('').trimEnd() + '…' : s;
    }
    const nm = (value, max) => esc(displayName(value, max));        // the same, ready for an HTML template

    // URL-looking text: scheme://..., www.xxx, domain.tld/path (any ending) and bare domains on common endings
    const LINK_ENDINGS = 'com|net|org|io|gg|tv|co|xyz|app|dev|info|biz|link|live|shop|site|online|top|club|vip|ly|cc|ws|ru|icu|cloud|page|store|tech|fun|pro|lol|win|bid|click|download|cam|gift|gifts|free|rocks|ninja|zip|tk|ml|ga|cf|pw';
    const DOMAIN_LABELS = '(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\\.)+';
    const LINK_PATTERN = new RegExp(
        '\\b[a-z][a-z0-9+.-]{1,15}:\\/\\/[^\\s]+' +                                       // anything://...
        '|\\bwww\\.[^\\s]+' +                                                              // www.example.com...
        '|\\b' + DOMAIN_LABELS + '[a-z]{2,24}(?::\\d{1,5})?\\/[^\\s]*' +                   // example.com/path
        '|\\b' + DOMAIN_LABELS + '(?:' + LINK_ENDINGS + ')\\b(?![-.]?[a-z0-9])',           // example.com
        'gi');
    const replaceLinks = (s) => String(s).replace(LINK_PATTERN, '[link]');

    function plainText(value, opts) {
        let s = cleanText(value);
        const chars = Array.from(s);
        if (chars.length > MAX_PLAIN_CHARS) s = chars.slice(0, MAX_PLAIN_CHARS).join('') + '…';
        if (opts && opts.hideLinks === true) s = replaceLinks(s);
        return s;
    }

    // Entity-decodes text (e.g. "&amp;" -> "&") without ever creating elements
    function decodeEntities(value) {
        return PARSER.parseFromString(String(value ?? ''), 'text/html').documentElement.textContent;
    }

    // ---- host allow-lists ---------------------------------------------------------------------------
    // 'a.example' matches exactly that host. '*.example' matches any subdomain of example ('x.example', 'x.y.example').
    // It does not match 'example' itself or look-alikes such as 'evilexample' or 'example.evil.com'. `hostname` comes from the URL parser:
    // already lower-case, punycode for non-ASCII names, brackets around IPv6, and a trailing dot kept (so it matches nothing).
    function hostMatches(list, hostname) {
        const h = String(hostname ?? '').toLowerCase();
        for (const entry of list) {
            if (entry.startsWith('*.')) {
                const suffix = entry.slice(2);
                if (h.length > suffix.length + 1 && h.endsWith('.' + suffix) &&
                    /^[a-z0-9_-]+(\.[a-z0-9_-]+)*$/.test(h.slice(0, h.length - suffix.length - 1))) return true;
            } else if (h === entry) return true;
        }
        return false;
    }

    // Checks a URL against a host list: https only, no user name or password, no port, and the host must be on the list.
    // Returns { url } (the normalised URL) or { url: '', why, host? } saying what was wrong.
    function vetUrl(value, hosts) {
        let u;
        try { u = new URL(String(value ?? '').trim()); } catch { return { url: '', why: 'not a valid URL' }; }
        if (u.protocol !== 'https:') return { url: '', why: 'not https' };
        if (u.username || u.password) return { url: '', why: 'credentials in the URL' };
        if (u.port) return { url: '', why: 'port not allowed' };
        if (!hostMatches(hosts, u.hostname)) return { url: '', why: 'host not allowed', host: u.hostname };
        if (u.href.length > 2048) return { url: '', why: 'URL too long' };
        return { url: u.href };
    }

    const DATA_IMAGE = new RegExp('^data:image\\/(?:png|gif|webp);base64,[A-Za-z0-9+\\/]{1,' + MAX_DATA_IMAGE_CHARS + '}={0,2}$', 'i');
    function vetImage(value) {
        const v = String(value ?? '').trim();
        if (/^data:/i.test(v)) return DATA_IMAGE.test(v) ? { url: v, inline: true } : { url: '', why: 'inline image not allowed' };
        const r = vetUrl(v, TRUSTED_IMAGE_HOSTS);
        if (r.url || !activeImageSites.size) return r;
        const hit = imageSiteLink(v, activeImageSites);                 // not an emote host: a picture of a site that is switched on for this receipt
        return hit ? (hit.failed ? { url: '', failed: true } : { url: hit.url, site: hit.site }) : r;      // (3.0.11: an address the action looked up and found no picture for: "[image]")
    }
    const trustedImageUrl = (value) => vetImage(value).url;

    const hostNote = (what, v) => v.host ? what + ' host not allowed: ' + v.host.slice(0, 60) : what + ' URL rejected (' + v.why + ')';

    // ---- images in messages (3.0.0-beta.9) ----------------------------------------------------------------------------------------------
    // A High Roller message may carry a link to a picture on a site that the streamer switched on in the dock (opts.imageSites, ids from IMAGE_SITES). The link is replaced by the
    // picture. 3.0.1: a message that is not a High Roller message (a cheer below the threshold, a printer that does not allow High Roller prints, any other kind of message) has no picture,
    // as it has no styling: its links stay text, and its HTML is printed as the words it says (flattenMarkup). The picture is an <img> that this code makes, never markup from the viewer,
    // and a site that was not switched on does nothing at all. What counts as a picture:
    //   * the address is https, with no user name, no password and no port; its host is one of the hosts of that site (exactly: no look-alike, no sub-domain); and its path has the
    //     shape of a DIRECT link of that site (IMAGE_PATHS) and ends in png, jpg, jpeg, gif or webp. A page of the site (an album, a viewer page), a video and an SVG are no picture
    //     here and stay text. A picture here is a raster picture inside an <img>, which cannot run a script and cannot load anything else.
    //   * the address that is fetched is built again from the parts that were checked (https, host, path). A query or a fragment is dropped, so a link carries nothing along with it.
    //   * at most MAX_MESSAGE_IMAGES pictures to a message (the later links stay text), each at most as wide as the paper and MAX_MESSAGE_IMAGE_INCHES of paper tall.
    //   * a picture that does not load within EMOTE_WAIT_MS, is not a picture, or has more than MAX_MESSAGE_IMAGE_PIXELS pixels is taken off the page ("[image]" stands in its place),
    //     and the download is stopped. The page's policy (img-src) and Edge's host rules list the hosts of every site, so even a mistake in this code cannot reach another host.
    // The same addresses are accepted in the <img> of a High Roller message when the site is switched on (and held to MAX_VIEWER_IMAGE_PX like any viewer image).
    const IMAGE_SITES = [{"id":"imgur","name":"Imgur","hosts":["i.imgur.com"]},{"id":"catbox","name":"Catbox","hosts":["files.catbox.moe"]},{"id":"imgbb","name":"ImgBB","hosts":["i.ibb.co"]}];             // [{ id, name, hosts }]: the sites a streamer may switch on (the dock lists them)
    // The shape of a direct link to a picture of each site, as the path of the address. A site that is in IMAGE_SITES and has no rule here is never used.
    const IMAGE_PATHS = {
        imgur: /^\/[A-Za-z0-9]{3,16}\.(?:png|jpe?g|gif|webp)$/i,                                                                    // i.imgur.com/<id>.<ext>
        catbox: /^\/[A-Za-z0-9_-]{3,40}\.(?:png|jpe?g|gif|webp)$/i,                                                                 // files.catbox.moe/<name>.<ext>
        imgbb: /^\/[A-Za-z0-9]{3,16}\/(?:[A-Za-z0-9_.~-]|%[0-9A-Fa-f]{2}){1,120}\.(?:png|jpe?g|gif|webp)$/i,                       // i.ibb.co/<id>/<name>.<ext>
    };
    // 3.0.11 (the owner, 16 October 2026: viewers paste the page of a picture or of an album instead of the direct link, and pay for a picture that never prints). Every form of
    // an Imgur link that Imgur itself answers for (checked against imgur.com on 16 October 2026) is one of three things (imgurLink):
    //   * ONE picture, with no lookup: i.imgur.com/<id> (Imgur sends it to the page of the picture), imgur.com/<id> and imgur.com/<id>.<ext> (also www. and m., which Imgur sends
    //     to imgur.com). It is asked for at i.imgur.com/<id>.<ext>: .jpg when the link names no extension, as Imgur sends the picture whatever extension is asked (a PNG asked
    //     for as .jpg comes back as image/png). The id is 5 to 7 letters and digits with at least one capital or digit: Imgur's own pages (/upload, /privacy, /removed) are words
    //     in small letters and stay text.
    //   * an ALBUM (Imgur calls it a post): imgur.com/a/<id>, /a/<id>.<ext> (Imgur sends it to /a/<id>), /a/<title>-<id>, /gallery/<id>, /gallery/<title>-<id> (also www. and m.),
    //     i.imgur.com/a/<id>(.<ext>) and i.imgur.com/gallery/<id>(.<ext>) (Imgur sends both to the album). The id of an album is not the id of its pictures, so only a lookup can
    //     tell which picture it holds: the action looks up the first picture of each album of a High Roller message before the print (PbImgur, Imgur's list of the album's
    //     pictures, else the album's preview picture) and gives the page opts.imgurAlbums, { <album id>: '<picture id>.<ext>' }, with '' for an album it could not look up. The
    //     page prints the first picture only, never the rest of the album; '' prints "[image]"; an album the action did not name (it found no picture, the first item is a
    //     video, or the lookup was not made) stays text. /a/<title>-<id>.<ext> and /gallery/<id>.<ext> on imgur.com are no address (Imgur answers 404) and stay text.
    //   * anything else on Imgur (a tag, a user page, a video, a word) stays text.
    // The page never fetches imgur.com (its policy and Edge's host rules do not let it): every picture comes from i.imgur.com, the one host of the site, and the address built
    // here then goes through the rule of the direct links (IMAGE_PATHS.imgur) like any other.
    const IMGUR_PAGE_HOSTS = ['imgur.com', 'www.imgur.com', 'm.imgur.com'];
    const IMGUR_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'webp'];
    const IMGUR_ONE = /^\/([A-Za-z0-9]{5,7})(\.[A-Za-z]{3,4})?\/?$/;                              // /<id>, /<id>.<ext>, either with a slash after it
    const IMGUR_ALBUM = /^\/(a|gallery)\/(?:([A-Za-z0-9]+(?:-[A-Za-z0-9]+)*)-)?([A-Za-z0-9]{5,7})(\.[A-Za-z]{3,4})?\/?$/;     // /a/<id>, /a/<title>-<id>, /gallery/..., an extension
    const IMGUR_PICTURE = /^[A-Za-z0-9]{5,10}\.(?:png|jpe?g|gif|webp)$/;                        // what the action may name as the first picture of an album
    const imgurId = (id) => /[A-Z0-9]/.test(id);                                                 // an id has a capital or a digit; Imgur's own pages are words in small letters
    const imgurExt = (dotted) => { const e = dotted ? dotted.slice(1).toLowerCase() : 'jpg'; return IMGUR_EXTS.includes(e) ? e : null; };
    // { direct: '/<id>.<ext>' } for one picture, { album: '<id>' } for an album, null for anything else. host is lower case (URL), path is the path of the address.
    function imgurLink(host, path) {
        const page = IMGUR_PAGE_HOSTS.includes(host);
        if (!page && host !== 'i.imgur.com') return null;
        const album = IMGUR_ALBUM.exec(path);
        if (album) {
            if (!imgurId(album[3])) return null;
            if (album[4] && (page ? album[1] === 'gallery' || album[2] : album[2])) return null;      // imgur.com/gallery/<id>.<ext> and /<title>-<id>.<ext> are 404 at Imgur
            if (album[4] && !imgurExt(album[4])) return null;
            if (!page && album[2]) return null;                                                     // i.imgur.com has no title form
            return { album: album[3] };
        }
        if (!page && IMAGE_PATHS.imgur.test(path)) return { direct: path };                        // i.imgur.com/<id>.<ext>: the direct link, as before
        const one = IMGUR_ONE.exec(path);
        if (!one || !imgurId(one[1])) return null;
        if (!page && one[2]) return null;                                                          // i.imgur.com/<id>.<ext> that is not a direct link (a video, an odd ending)
        const ext = imgurExt(one[2]);
        return ext ? { direct: '/' + one[1] + '.' + ext } : null;
    }
    // 3.1.0 (the owner, 16 October 2026): an album of Catbox or ImgBB, and the page of one ImgBB picture, print their first picture as an Imgur album does (checked against catbox.moe
    // and ibb.co on 16 October 2026; DEVELOPMENT.md, section 10, has every form and what Catbox and ImgBB answer for it):
    //   * Catbox (catboxLink): files.catbox.moe/<name>.<ext> is the direct link, as before. files.catbox.moe/thumbs/t_<name>.<ext> is the small copy that the page of an album
    //     shows (and that "copy image address" gives there): it prints the file itself, files.catbox.moe/<name>.<ext>, with no lookup. catbox.moe/c/<id> is an album (Catbox calls
    //     it a collection; <id> is 6 letters and digits in any case, read in small letters): the action looks up its first file. A slash after it and a query are accepted and
    //     dropped, though Catbox itself answers 404 for them (the owner: a viewer's slip, rare but real). Any other address of Catbox stays text.
    //   * ImgBB (imgbbLink): i.ibb.co/<id>/<name>.<ext> is the direct link, as before, and i.ibb.co.com/<id>/<name>.<ext> (ImgBB's second domain) is the same picture, asked for at
    //     i.ibb.co. ibb.co/album/<id> is an album (also www.ibb.co, imgbb.com, www.imgbb.com, ibb.co.com and a user's <name>.imgbb.com; a slash after it): the action looks up the
    //     first picture as the album shows it, the newest by default, or the first in the order that the link's ?sort= names (a word, then _asc or _desc). ibb.co/<id> (the
    //     "viewer link" ImgBB gives after an upload; also www.ibb.co, imgbb.com, www.imgbb.com and ibb.co.com, a slash after it; <id> is 5 to 10 letters and digits with a capital
    //     or a digit) is the page of one picture: the action looks up its original. The delete link (ibb.co/<id>/<code>), the embed codes and the sub-albums of an album
    //     (/album/<id>/embeds, /sub), a user's page and anything else stay text.
    // The action's answers come as opts.catboxAlbums ({ <id>: '<name>.<ext>' }), opts.imgbbAlbums ({ <id> or <id>?sort=<sort>: '<id>/<name>.<ext>' }) and opts.imgbbPages
    // ({ <id>: '<id>/<name>.<ext>' }), with '' for no picture ("[image]"); a link with no entry stays text. The pictures still come only from files.catbox.moe and i.ibb.co.
    const CATBOX_THUMB = /^\/thumbs\/t_([A-Za-z0-9_-]{3,40}\.(?:png|jpe?g|gif|webp))$/i;       // files.catbox.moe/thumbs/t_<name>.<ext>
    const CATBOX_ALBUM = /^\/c\/([A-Za-z0-9]{6})\/?$/;                                           // catbox.moe/c/<id>, a slash after it
    const CATBOX_PICTURE = /^[A-Za-z0-9_-]{3,40}\.(?:png|jpe?g|gif|webp)$/i;                     // what the action may name as the first file of a Catbox album
    // { direct: '/<name>.<ext>' } for a file, { album: '<id>' } for an album, null for anything else. host is lower case (URL), path is the path of the address.
    function catboxLink(host, path) {
        if (host === 'files.catbox.moe') {
            if (IMAGE_PATHS.catbox.test(path)) return { direct: path };                           // files.catbox.moe/<name>.<ext>: the direct link, as before
            const thumb = CATBOX_THUMB.exec(path);
            return thumb ? { direct: '/' + thumb[1] } : null;                                     // the thumbnail: the file itself
        }
        if (host !== 'catbox.moe') return null;
        const album = CATBOX_ALBUM.exec(path);
        return album ? { album: album[1].toLowerCase() } : null;
    }
    const IMGBB_HOSTS = ['ibb.co', 'www.ibb.co', 'imgbb.com', 'www.imgbb.com', 'ibb.co.com'];      // the hosts of ImgBB's pages
    const IMGBB_USER_HOST = /^[a-z0-9][a-z0-9-]{0,62}\.imgbb\.com$/;                             // a user's own subdomain: it shows the user's albums, no page of one picture
    const IMGBB_ALBUM = /^\/album\/([A-Za-z0-9]{3,16})\/?$/;                                       // /album/<id>, a slash after it
    const IMGBB_PAGE = /^\/([A-Za-z0-9]{5,10})\/?$/;                                               // /<id>, a slash after it
    const IMGBB_SORT = /^[a-z]{1,12}_(?:asc|desc)$/;                                               // ?sort=date_asc, name_desc ...
    const IMGBB_PICTURE = /^[A-Za-z0-9]{3,16}\/(?:[A-Za-z0-9_.~-]|%[0-9A-Fa-f]{2}){1,120}\.(?:png|jpe?g|gif|webp)$/i;      // what the action may name: '<id>/<name>.<ext>'
    const imgbbHost = (host) => host === 'i.ibb.co' || host === 'i.ibb.co.com' || IMGBB_HOSTS.includes(host) || IMGBB_USER_HOST.test(host);
    // The sort of an album link as the action reads it: '' for none, for another shape, and for date_desc (the order an album shows anyway)
    const imgbbSort = (sort) => typeof sort === 'string' && IMGBB_SORT.test(sort) && sort !== 'date_desc' ? sort : '';
    // { direct: '/<id>/<name>.<ext>' }, { album: '<id>' or '<id>?sort=<sort>' }, { page: '<id>' }, null for anything else. sort is the first ?sort= of the address (URLSearchParams).
    function imgbbLink(host, path, sort) {
        if (host === 'i.ibb.co' || host === 'i.ibb.co.com') return IMAGE_PATHS.imgbb.test(path) ? { direct: path } : null;      // the direct link (on either domain)
        const main = IMGBB_HOSTS.includes(host);
        if (!main && !IMGBB_USER_HOST.test(host)) return null;
        const album = IMGBB_ALBUM.exec(path);
        if (album) { const s = imgbbSort(sort); return { album: s ? album[1] + '?sort=' + s : album[1] }; }
        if (!main) return null;
        const page = IMGBB_PAGE.exec(path);
        return page && /[A-Z0-9]/.test(page[1]) ? { page: page[1] } : null;                       // an id has a capital or a digit; ImgBB's own pages are words in small letters
    }
    // 3.0.11, 3.1.0: the action's answers for the receipt that is being built (lookupsOf): Imgur albums, Catbox albums, ImgBB albums and pages of one ImgBB picture
    const NO_LOOKUPS = { imgur: new Map(), catbox: new Map(), imgbbAlbum: new Map(), imgbbPage: new Map() };
    let activeLookups = NO_LOOKUPS;
    // One table of the options, checked: a key of the shape `key`, a value that is '' or of the shape `value`. At most 16 entries; anything else is ignored.
    function lookupTable(o, key, value) {
        const out = new Map();
        if (!o || typeof o !== 'object' || Array.isArray(o)) return out;
        for (const k of Object.keys(o).slice(0, 16)) {
            const v = o[k];
            if (key.test(k) && typeof v === 'string' && (v === '' || value.test(v))) out.set(k, v);
        }
        return out;
    }
    // The tables of opts: imgurAlbums (3.0.11), catboxAlbums, imgbbAlbums and imgbbPages (3.1.0)
    function lookupsOf(opts) {
        const o = opts || {};
        return {
            imgur: lookupTable(o.imgurAlbums, /^[A-Za-z0-9]{5,7}$/, IMGUR_PICTURE),
            catbox: lookupTable(o.catboxAlbums, /^[a-z0-9]{6}$/, CATBOX_PICTURE),
            imgbbAlbum: lookupTable(o.imgbbAlbums, /^[A-Za-z0-9]{3,16}(?:\?sort=[a-z]{1,12}_(?:asc|desc))?$/, IMGBB_PICTURE),
            imgbbPage: lookupTable(o.imgbbPages, /^[A-Za-z0-9]{5,10}$/, IMGBB_PICTURE),
        };
    }
    const MAX_MESSAGE_IMAGES = 3;                        // pictures in one message
    const MAX_MESSAGE_IMAGE_INCHES = 4;                  // the tallest a picture in a message prints, in inches of paper
    const MAX_MESSAGE_IMAGE_PIXELS = 32 * 1024 * 1024;   // a picture with more pixels than this is not shown (a 12 or 24 megapixel photo is far below, a receipt prints 576 dots across at most, and 32 million pixels are 134 MB once decoded)
    const MAX_MESSAGE_IMAGE_URL = 400;                   // characters of an address
    let activeImageSites = new Set();                    // the sites that are on for the receipt that is being built (see show). Empty between receipts
    const sitePictures = new WeakSet();                  // the <img> elements of a High Roller message whose address is a picture of an image site (set by copyAttributes, never by the viewer)
    const failedAlbumImages = new WeakSet();             // 3.0.11: the <img> elements whose address the action looked up and found no picture for (set by copyAttributes): "[image]"
    const badImageTexts = new WeakMap();                 // 3.2.0-beta.8: the words [image] that stand for a picture whose address failed a moment ago -> that address (messageImageElement)
    let pictureShown = false;                            // a picture of an image site was put on the page since it was last put at rest: rest() says so, and the action then empties the browser's cache

    // The ids of opts.imageSites that this page knows (it has the site and a rule for it). Anything else in the list is ignored.
    function enabledImageSites(opts) {
        const out = new Set();
        const list = opts && Array.isArray(opts.imageSites) ? opts.imageSites : [];
        for (const id of list.slice(0, 16))
            if (typeof id === 'string' && own(IMAGE_PATHS, id) && IMAGE_SITES.some(s => s.id === id)) out.add(id);
        return out;
    }

    // { url, site } for an address that is a direct picture link of one of the sites in `enabled` (a Set of ids), else null. `url` is the rebuilt address. 3.0.11: an address
    // that the action looked up and found no picture for gives { url: '', site, failed: true } ("[image]" where it stood). `lookups` are the action's tables (lookupsOf);
    // the page uses the ones of the receipt that is being built.
    function imageSiteLink(raw, enabled, lookups) {
        if (!enabled || !enabled.size) return null;
        const text = String(raw ?? '').trim();
        if (!/^https:\/\//i.test(text)) return null;                    // typed as https:// (the address parser also takes https:/host and https:\\host, which no viewer writes)
        let u;
        try { u = new URL(text); } catch { return null; }
        if (u.protocol !== 'https:' || u.username || u.password || u.port) return null;
        let host = u.hostname, path = u.pathname;
        const tables = lookups || activeLookups;
        // every form of a link of Imgur (imgurLink, 3.0.11), Catbox and ImgBB (catboxLink, imgbbLink, 3.1.0): one picture, or the table and the key of a lookup
        let kind = null, link = null, table = null, key = null;
        if (enabled.has('imgur') && (host === 'i.imgur.com' || IMGUR_PAGE_HOSTS.includes(host))) {
            kind = 'imgur'; link = imgurLink(host, path); host = 'i.imgur.com';
            if (link && link.album !== undefined) { table = tables.imgur; key = link.album; }
        }
        else if (enabled.has('catbox') && (host === 'files.catbox.moe' || host === 'catbox.moe')) {
            kind = 'catbox'; link = catboxLink(host, path); host = 'files.catbox.moe';
            if (link && link.album !== undefined) { table = tables.catbox; key = link.album; }
        }
        else if (enabled.has('imgbb') && imgbbHost(host)) {
            kind = 'imgbb'; link = imgbbLink(host, path, u.searchParams.get('sort')); host = 'i.ibb.co';
            if (link && link.album !== undefined) { table = tables.imgbbAlbum; key = link.album; }
            else if (link && link.page !== undefined) { table = tables.imgbbPage; key = link.page; }
        }
        if (kind) {
            if (!link) return null;
            if (table) {
                if (!table.has(key)) return null;                                         // not looked up (or the first item is a video): stays text
                const first = table.get(key);
                if (first === '') return { url: '', site: kind, failed: true };          // looked up, no picture: "[image]"
                path = '/' + first;
            }
            else path = link.direct;
        }
        for (const site of IMAGE_SITES) {
            if (!enabled.has(site.id) || !own(IMAGE_PATHS, site.id) || !site.hosts.includes(host)) continue;
            if (!IMAGE_PATHS[site.id].test(path)) return null;
            const url = 'https://' + host + path;
            return url.length <= MAX_MESSAGE_IMAGE_URL ? { url, site: site.id } : null;
        }
        return null;
    }

    // A cleaned message as a list of pieces: { text } and { image: url }. A link to a picture of a switched-on site is a picture piece (with at most `most` of them, the room the message
    // has left of MAX_MESSAGE_IMAGES, and the punctuation that ends a sentence after it is dropped); every other link stays text. The text pieces are the message without those links, in order.
    function messagePieces(text, enabled, most) {
        const pieces = [];
        const add = (s) => { if (!s) return; const last = pieces[pieces.length - 1]; if (last && last.text !== undefined) last.text += s; else pieces.push({ text: s }); };
        const re = new RegExp(LINK_PATTERN.source, 'gi');
        let from = 0, images = 0, m;
        while ((m = re.exec(text)) !== null) {
            const token = m[0];
            const trail = /[.,;:!?)\]}>'"]+$/.exec(token);
            const hit = images < most ? imageSiteLink(trail ? token.slice(0, token.length - trail[0].length) : token, enabled) : null;
            add(text.slice(from, m.index));
            if (hit) { images++; pieces.push({ image: hit.url }); }       // (3.0.11: '' for an address the action looked up and found no picture for, which prints "[image]")
            else add(token);
            from = m.index + token.length;
        }
        add(text.slice(from));
        return pieces;
    }

    // A viewer's message that holds HTML tags and is printed as an ordinary message (a High Roller message on a printer that does not allow High Roller prints, or a cheer below the threshold) is printed
    // as the words it says: the tags are not printed as words (3.0.0; before it, "<img src=" and "</a><span style=..." came out on the paper, with the picture in the middle of them). An <img> goes
    // with its address (3.0.1: a message that is not a High Roller message has no picture and no styling, only its words), the tags that break a line become line breaks, a script or a style goes with
    // what is inside it, a comment goes (with the decoding), and the entities are decoded (they were written for HTML). A message with no tag in it is not touched, and the result is only ever
    // text: it is set as text nodes.
    const TAG_LIKE = /<\/?[a-z][^>]*>|<!--/i;
    function flattenMarkup(value) {
        let s = String(value ?? '');
        if (!TAG_LIKE.test(s)) return s;
        s = s.slice(0, MAX_RICH_CHARS);
        s = s.replace(/<(script|style)\b[\s\S]*?(?:<\/\1\s*>|$)/gi, ' ');
        s = s.replace(/<img\b[^>]*>/gi, ' ');
        s = s.replace(/<\/?(?:br|p|div|li|ul|ol|tr|h[1-6]|blockquote|pre|hr|table|tbody|thead|tfoot|caption|center)\b[^>]*>/gi, '\n');
        s = s.replace(/<\/?[a-z][^>]*>/gi, '');
        return decodeEntities(s);
    }

    // The part of a receipt for a viewer's message that is not a High Roller message: its words, as text. 3.0.1: no picture and no styling in it, whatever sites are switched on (a link to a picture
    // is a link, printed as text or as "[link]"). Pictures belong to the High Roller messages, which are built from rich content (see pictureLinksInRich).
    function messagePart(value, opts) {
        return { kind: 'message', text: plainText(flattenMarkup(value), opts) };
    }

    // Builds the pieces of a message into `div`: text as text nodes, a picture as an <img> that is a block of its own. An address that failed a moment ago is "[image]" at once.
    // The element for one picture of a message: an <img> made here (never markup of the viewer), or the text "[image]" when this address failed a moment ago.
    function messageImageElement(url, opts) {
        if (!url) return document.createTextNode('[image]');                          // (no address: the action looked it up and found no picture, 3.0.11)
        if (isBadImage(url)) { const words = document.createTextNode('[image]'); badImageTexts.set(words, url); return words; }
        const large = largeLayoutPx(opts) !== null;                    // in the large layout a picture is as tall as the space the message has left (receipt.css), so it gets no height of its own
        const img = document.createElement('img');
        img.className = 'msg-image';
        img.setAttribute('alt', '[image]');
        img.referrerPolicy = 'no-referrer';
        img.decoding = 'async';
        if (!large) img.style.setProperty('max-height', Math.round(MAX_MESSAGE_IMAGE_INCHES * pxPerInch(opts)) + 'px');
        img.setAttribute('src', url);                                  // checked by imageSiteLink: https, a host of a switched-on site, the path of a direct picture link
        pictureShown = true;
        return img;
    }

    function fillMessage(div, pieces, opts) {
        for (const p of pieces) {
            if (p.image === undefined) { if (p.text.trim()) div.appendChild(document.createTextNode(p.text)); continue; }
            div.appendChild(messageImageElement(p.image, opts));
        }
    }

    // 3.0.0: a link to a picture of a switched-on site in the text of a High Roller message is a picture, as it is in an ordinary message, and the styling around it stays: the message is
    // sanitized first (so every node here is one the allow-list made), and only the text nodes are looked at. The link itself is replaced by the picture, an address that is no picture stays
    // text. Together with the <img> tags of the message (see sitePictures) there are at most MAX_MESSAGE_IMAGES pictures.
    function pictureLinksInRich(root, opts) {
        if (!activeImageSites.size) return;
        let room = MAX_MESSAGE_IMAGES;
        for (const img of Array.from(root.querySelectorAll('img'))) if (sitePictures.has(img)) room--;
        const nodes = [];
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        while (walker.nextNode()) nodes.push(walker.currentNode);
        for (const node of nodes) {
            if (room <= 0) break;
            const pieces = messagePieces(node.data, activeImageSites, room);
            const found = pieces.filter(p => p.image !== undefined).length;
            if (!found) continue;
            room -= found;
            const frag = document.createDocumentFragment();
            for (const p of pieces) frag.appendChild(p.image === undefined ? document.createTextNode(p.text) : messageImageElement(p.image, opts));
            node.parentNode.replaceChild(frag, node);
        }
    }

    // 3.0.0: in the large layout a picture of an image site in a High Roller message is not left inside the styled text, where it would be a thumbnail of 64 px at the place the viewer put it.
    // It is taken out and set after the message like the picture of a plain message (at most MAX_MESSAGE_IMAGES, in the order they came): a frame that takes the space the words leave, and the
    // choice of the printer (fill, fit or stretch) says what the picture does inside it. The styled text keeps everything else it had. Pictures of another kind (emotes) stay where they are.
    // withBad (3.2.0-beta.8, a sticker and a card): the words [image] of a link whose address failed a moment ago (badImageTexts) go along in their place among the pictures, so the
    // second print within the memory of bad pictures has them in the box of the pictures as the first one had (the audit of 19 October: they stayed in the words)
    function hoistSitePictures(content, opts, withBad) {
        const urls = [];
        let first = null;                                                                                   // the styled part that held the first picture, and whether words came before it
        let nodes = Array.from(content.querySelectorAll('.part.raw img'));
        if (withBad) {
            const marks = [];
            const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
            while (walker.nextNode()) if (badImageTexts.has(walker.currentNode) && walker.currentNode.parentNode.closest('.part.raw')) marks.push(walker.currentNode);
            if (marks.length) nodes = nodes.concat(marks).sort((a, b) => (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1);       // in the order of the message
        }
        for (const img of nodes) {
            const mark = img.nodeType === Node.TEXT_NODE;
            if (!mark && !sitePictures.has(img) && !img.classList.contains('msg-image')) continue;         // a picture of a site (an <img> tag, or a link that became one): not an emote
            if (first === null) {
                const part = (mark ? img.parentNode : img).closest('.part.raw');
                const before = document.createRange();
                before.setStart(part, 0); before.setEndBefore(img);
                first = { part, wordsFirst: before.toString().trim().length > 0 };
            }
            const src = mark ? badImageTexts.get(img) : img.getAttribute('src');
            img.remove();
            if (src && urls.length < MAX_MESSAGE_IMAGES) urls.push(src);
        }
        if (!urls.length) return;
        const div = document.createElement('div');
        div.className = 'part message pictures';
        fillMessage(div, urls.map(u => ({ image: u })), opts);
        // 3.0.1: the pictures keep the side of the words the viewer gave them: a message that starts with its picture (before any word) prints the picture first, as the HTML reads. A picture that
        // comes after words, or in the middle of them, is set after the message (the styled text is one box and cannot be cut around a frame).
        if (first && !first.wordsFirst && first.part.parentNode === content) content.insertBefore(div, first.part);
        else content.appendChild(div);
    }

    // 3.0.0: a message with pictures must not take a second page. In the layout of a roll scaled to the page a picture is as tall as its own shape asks (4 inches at most), so before any word is cut
    // the excess is taken off the pictures, equally, down to three quarters of an inch. (In the large layout the pictures are frames that already take only what the words leave.) Returns
    // whether there was a picture to shrink.
    function shrinkPictures(over, opts) {
        const imgs = Array.from($('receipt-content').querySelectorAll('img.msg-image')).filter(i => i.getAttribute('src'));
        if (!imgs.length || !(over > 0)) return false;
        const floor = Math.round(pxPerInch(opts) * 0.75), share = over / imgs.length;
        for (const img of imgs) img.style.setProperty('max-height', Math.max(floor, Math.floor(img.getBoundingClientRect().height - share)) + 'px');
        return true;
    }

    // A picture of a message that did not come (or is not usable) leaves the page, and its download stops. The text "[image]" stands in its place.
    function dropMessageImage(img, why) {
        if (why) securityNotes.add(why);
        img.removeAttribute('src');
        if (img.parentNode) img.parentNode.replaceChild(document.createTextNode('[image]'), img);
    }

    // Avatars come from the platforms and are held to the allow-list too. A refusal names the host in the log.
    function safeAvatarUrl(value) {
        if (value === undefined || value === null || value === '') return '';
        const v = vetUrl(value, AVATAR_HOSTS);
        if (!v.url) securityNotes.add(hostNote('avatar', v));
        return v.url;
    }

    // ---- viewer images (High Roller) ------------------------------------------------------------------
    // Whatever size a viewer asks for, an image in a message is held to MAX_VIEWER_IMAGE_PX: width/height attributes are capped, the
    // limits below are inline and !important (so the viewer's own style can't override them), and the image itself can't be scaled up.
    // render() then measures the finished layout and hides any image that is still larger (a scaled parent can defeat the CSS).
    function clampImage(el) {
        const st = el.style;
        if (/scale|matrix/i.test(st.getPropertyValue('transform'))) st.removeProperty('transform');
        st.removeProperty('scale');
        const px = MAX_VIEWER_IMAGE_PX + 'px';
        for (const [prop, value] of [['max-width', px], ['max-height', px], ['min-width', '0'], ['min-height', '0'], ['object-fit', 'contain']])

    }

    function copyStyle(srcEl, el) {
        const st = srcEl.style;                          // the inert document's own CSSOM: parsed and normalised by the browser
        let kept = 0;
        for (let i = 0; i < st.length && kept < MAX_STYLE_PROPS; i++) {
            const prop = st[i], value = st.getPropertyValue(prop).trim();
            if (!ALLOWED_CSS.has(prop)) {
                const family = CSS_RISKY_FAMILY.exec(prop);
                if (family && prop !== 'background-color') securityNotes.add('css ' + family[1]);       // one line per kind (background-image, -position, ... are one)
                continue;
            }
            if (!value || value.length > 200 || CSS_VALUE_FORBIDDEN.test(value)) { securityNotes.add('css value'); continue; }
            if (CSS_VALUE_ALLOWED[prop] && !CSS_VALUE_ALLOWED[prop].includes(value.toLowerCase())) { securityNotes.add('css ' + prop); continue; }
            el.style.setProperty(prop, value);
            kept++;
        }
    }

    const LINK_OR_SOURCE_ATTRIBUTE = /^(href|src|srcset|srcdoc|action|formaction|data|ping|background|xlink:href)$/;

    function copyAttributes(src, el, tag) {
        for (const a of Array.from(src.attributes)) {
            const name = a.name.toLowerCase(), value = a.value;
            if (name === 'style') copyStyle(src, el);
            else if (tag === 'img' && name === 'src') {
                const v = vetImage(value);
                if (!v.url && v.failed) failedAlbumImages.add(el);                                           // 3.0.11: the action looked it up and found no picture: "[image]", not a refusal
                else if (!v.url) securityNotes.add(v.host ? hostNote('image', v) : 'untrusted image');
                else if (v.inline) { el.setAttribute('src', v.url); securityNotes.add('inline image'); }          // tiny inline picture: allowed, and unusual enough to log
                else if (!isBadImage(v.url)) {                                                                // (an emote that already failed or hung is left out)
                    el.setAttribute('src', v.url);
                    if (v.site) { el.referrerPolicy = 'no-referrer'; pictureShown = true; sitePictures.add(el); }       // a picture of an image site is fetched once, as it is, and not kept alive
                    else pinImage(v.url);
                }
            }
            else if (tag === 'img' && name === 'alt') el.setAttribute('alt', value.slice(0, 100));
            else if (tag === 'img' && name === 'class') { const c = value.split(/\s+/).filter(x => x === 'emote' || x === 'bits'); if (c.length) el.className = c.join(' '); }
            else if (tag === 'img' && (name === 'width' || name === 'height')) {
                const n = parseInt(value, 10);
                if (n > 0) { el.setAttribute(name, String(Math.min(n, MAX_VIEWER_IMAGE_PX))); if (n > MAX_VIEWER_IMAGE_PX) securityNotes.add('image size limited'); }
            }
            else if ((tag === 'td' || tag === 'th') && (name === 'colspan' || name === 'rowspan')) { const n = parseInt(value, 10); if (n > 0 && n <= 20) el.setAttribute(name, String(n)); }
            else if (name.startsWith('on')) securityNotes.add('event handler');
            else if (LINK_OR_SOURCE_ATTRIBUTE.test(name)) securityNotes.add('link or source');
            // everything else (id, name, class, data-*, ...) is dropped silently
        }
    }

    // A tag that is removed while its text stays: say so for links and form controls, and look at its attributes (handlers, links)
    function noteUnwrapped(src, tag) {
        if (NOTED_WHEN_UNWRAPPED.has(tag)) securityNotes.add(tag === 'a' ? 'link' : tag);
        for (const a of Array.from(src.attributes)) {
            const name = a.name.toLowerCase();
            if (name.startsWith('on')) securityNotes.add('event handler');
            else if (LINK_OR_SOURCE_ATTRIBUTE.test(name)) securityNotes.add('link or source');
        }
    }

    function copyChildren(from, into, depth, budget) {
