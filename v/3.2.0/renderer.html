            finally { clearTimeout(timer); }
            if (res.none) forgetForLong(key, res.url);
            else if (res.url && !res.failed) remember(key, res.url);
            else forget(key, res.url);
            return res;
        })().finally(() => avatarPending.delete(key));
        avatarPending.set(key, p);
        return p;
    }

    // What a print waits for: the lookup, up to the budget. Missing the budget is remembered at once, so the same viewer's next
    // print doesn't wait again. The lookup carries on, and if it succeeds later, remember() lifts that note.
    function waitForLookup(p, key) {
        return new Promise((resolve) => {
            const timer = setTimeout(() => { forget(key, ''); resolve(''); }, AVATAR_LOOKUP_BUDGET_MS);
            p.then((res) => { clearTimeout(timer); if (res.note) securityNotes.add(res.note); resolve(res.url); },
                   () => { clearTimeout(timer); resolve(''); });
        });
    }

    function refreshInBackground(key, name, platform) {
        const neg = avatarNegative.get(key);
        if (avatarPending.has(key) || (neg && neg.until > Date.now())) return;
        startLookup(key, name, platform);
    }

    // Returns an image URL (already checked against the allow-list), or '' (the receipt prints without an avatar).
    function getAvatar(name, platform) {
        if (name === undefined || name === null || name === '') return Promise.resolve('');
        const text = String(name);
        const key = `${text.toLowerCase()}-${platform}`;
        const now = Date.now();
        const hit = avatarCache.get(key);
        if (hit) {                                                     // known: use it now, and refresh it quietly when it is old or its image is dead
            const alive = !isBadImage(hit.url);
            if (!alive || now - hit.ts >= AVATAR_TTL_MS) refreshInBackground(key, text, platform);
            return Promise.resolve(alive ? hit.url : '');
        }
        // Twitch logins are 1-25 letters, digits and underscores, and Kick names are short too. Anything else (a tip's free-text name) can't have an avatar there.
        if (platform === 'kick' ? text.length > 64 : !/^\w{1,25}$/.test(text)) return Promise.resolve('');
        const neg = avatarNegative.get(key);
        if (neg && neg.until > now) return Promise.resolve(neg.url);
        return waitForLookup(avatarPending.get(key) || startLookup(key, text, platform), key);
    }


    // ------------------------------------------------------------------
    // Event handlers. Each returns a receipt model, or null to print nothing:
    //   avatar        image URL ('' = no avatar)         avatarSquare   true = no round crop
    //   title/titleHtml, subtitle                         (text is escaped, titleHtml is used as-is)
    //   titleBig      larger title (used for money amounts)
    //   content       a part or a list of parts (below); nothing = no content area
    //   icon          'twitch' | 'youtube' | 'kick'
    //   bannerHtml    a drawing (the Hype Train pieces). bannerAt 'top' (the default) puts it above the header, with bannerClass 'art' (across the receipt) or
    //                 'cap' (on the avatar). bannerAt 'bottom' puts it under the date line, as the last thing on the receipt (always 'art')
    //
    // Content parts have a role, so every receipt looks the same way:
    //   text(html)     plain facts, with <b> on the key words (names, numbers)
    //   lead(html)     the one bold line saying what happened ("First time subscriber!")
    //   stat(html)     one fact as "label: value" with the value in <b>, set closer to the next fact than other parts are ("Total time subscribed: 8 months")
    //   message(text)  what the viewer wrote, in quotes. Always shown as plain TEXT: any markup they typed prints literally
    //   { kind: 'raw', rich }   High Roller message: HTML styling is kept after it passes through sanitizeRich() (see Safety above)
    //
    // text/lead/stat parts take HTML templates: every viewer-controlled value in them MUST go through nm() (= esc(displayName())).
    // Names that go into a title or subtitle as text go through displayName().
    // ------------------------------------------------------------------

    const text = (html) => ({ kind: 'text', html });
    const lead = (html) => ({ kind: 'lead', html });
    const stat = (html) => ({ kind: 'stat', html });
    const message = (value) => value ? { kind: 'message', value } : null;

    // 3.0.4: the message of a real cheer holds its cheermotes, the words that pay the bits ("Cheer2000 Look at this"): Streamer.bot sends the message as Twitch wrote it, and its own tests of a
    // cheer send it without them. On the receipt a cheermote is no word of the viewer (the title says the bits), and printed as text it also put itself before a picture that opens the message, which
    // then went below the words (the owner's cheer of 14 October). So a word that is a cheermote is taken out of a cheer's message: one of Twitch's cheermotes (a channel's own cheermotes keep the
    // name Cheer) with its number, a word of its own (spaces or the ends of the message around it), in any capitals. Anything else stays: Cheer with no number, Cheer100x, Win10, a cheermote
    // inside a tag (<b>Cheer100</b> is no cheermote on Twitch either). A message of cheermotes alone is no message.
    const CHEERMOTE_NAMES = ['cheer', 'doodlecheer', 'biblethump', 'cheerwhal', 'corgo', 'scoops', 'uni', 'showlove', 'party', 'seemsgood', 'pride', 'kappa', 'frankerz', 'heyguys', 'dansgame',
        'elegiggle', 'trihard', 'kreygasm', '4head', 'swiftrage', 'notlikethis', 'failfish', 'vohiyo', 'pjsalt', 'mrdestructoid', 'bday', 'ripcheer', 'shamrock', 'bitboss', 'streamlabs', 'muxy',
        'holidaycheer', 'goal', 'anon', 'charity'];
    // 3.0.6: a cheermote goes together with one of the spaces around it, so no space stays where it was (3.0.4 left them: "Cheer100 Hello" printed as "“ Hello”", with a gap after
    // the opening quote, and "Hello Cheer100 there" with two spaces). One that opens the message goes with the space after it; any other goes with the space before it, and the space after it
    // stays between the words around it. The viewer's own spaces away from a cheermote stay as typed.
    // A cheermote's number is its bits, 1 to 100,000 (Twitch's Get Cheermotes: the tiers are 1 to 100000, and "the minimum Bits value of the last tier is the maximum number of Bits
    // you can cheer using this Cheermote"), written with no leading zero: Cheer0, Cheer007 and Cheer100001 are words of the viewer and stay.
    const CHEERMOTE_BITS = '(?:100000|[1-9][0-9]{0,4})';
    const CHEERMOTE_LEAD = new RegExp('^(\\s*)(?:' + CHEERMOTE_NAMES.join('|') + ')' + CHEERMOTE_BITS + '(?:\\s+|$)', 'i');
    const CHEERMOTE_INNER = new RegExp('\\s+(?:' + CHEERMOTE_NAMES.join('|') + ')' + CHEERMOTE_BITS + '(?=\\s|$)', 'gi');
    function cheerWords(value) {

        let said = value, before;
        do { before = said; said = said.replace(CHEERMOTE_LEAD, '$1'); } while (said !== before);     // the cheermotes that open the message, one after the other
        said = said.replace(CHEERMOTE_INNER, '');                                                    // every other one, with the space before it
        return said.trim() ? said : '';

    const own = (table, key) => typeof key === 'string' && Object.prototype.hasOwnProperty.call(table, key);

    // keeps a tally of the bits of its own. While a train is on, every Cheer event adds its bits to the cheerer in the tally, and the top cheerer
    // that Twitch reports lifts that cheerer's figure to Twitch's own. The tally starts at the Start event, so a cheer from before it is in the
    // tally only through that top figure.

    const HYPE_RESUME_MS = 2 * 60 * 60 * 1000;         // a train whose end receipt the clock printed is taken up again when it speaks within this long
    const HYPE_MAX_NUMBER = 1e12;

    // The three pieces are drawn side on, nose to the right, and they print LONG WAYS, along the length of the paper, with the wheels and rails down its LEFT

    // reversed, and it reads from the top of the receipt down. The drawings are 260 by 142 units and sit in a frame of 142 by 260.
    // Each of the three pieces comes in three kinds, so a receipt shows which train it is: 'regular' (plain outlines), 'treasure' (the Treasure Train hauls
    // loot: a chest, coins for smoke and a gem on the engine, a gondola piled with coins) and 'golden_kappa' (the Golden Kappa Train is gold: a hatched body,

    const ART = (() => {

        // flip: mirror the drawing before the quarter turn, so a piece drawn nose to the right ends up with its nose toward the top of the receipt. The drawing

        const cap = '<svg viewBox="0 0 170 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Conductor\'s cap"><g fill="#fff" stroke="#000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">' +

            '<path d="M20,64Q85,88 150,64Q156,76 138,80Q85,94 32,80Q14,76 20,64Z" stroke="#fff" stroke-width="12"/>' +
            '<path d="M26,26L34,58H136L144,26Z"/><ellipse cx="85" cy="26" rx="59" ry="12"/>' +
            '<path d="M33,52H137L138,66Q85,78 32,66Z" fill="#000"/>' +
            '<path d="M20,64Q85,88 150,64Q156,76 138,80Q85,94 32,80Q14,76 20,64Z" fill="#000"/>' +
            `<circle cx="85" cy="60" r="11" fill="#fff"/><polygon points="${star(85, 60, 8.5, 3.6)}" fill="#000" stroke="none"/></g></svg>`;
        return { engine, car, caboose, cap };
    })();

    // ---- the state of a train ----
    // id: the train's id (Streamer.bot's `id`), '' when an event carries none. active: a train is on. users: login -> { name, bits } for the
    // tally. otherBits: bits from anonymous cheerers and from cheerers pushed out of the tally. conductor: the login of the top cheerer
    // that has been announced, with the name and bits as announced. subConductor: the same for the top sub gifter, with the points. stage: how far
    // a test train has got (see HYPE_STEPS). ended: its End receipt has printed, so a second End event for the same train prints nothing.
    function newHype() {
        return { id: '', active: false, ended: false, endedBy: '', seen: 0, startedAt: 0, level: 0, otherBits: 0, users: new Map(),
                 conductor: '', conductorName: '', conductorBits: 0, subConductor: '', subConductorName: '', subConductorPoints: 0, stage: 0, sampleType: 'regular' };
    }
    const hypeLive = newHype(), hypeTest = newHype();
    let hype = hypeLive;                                // the state the receipt in hand uses (render() points it at hypeTest for a test print)

    const hypeNum = (v) => { const n = Number(v); return Number.isFinite(n) && n > 0 ? Math.min(Math.round(n), HYPE_MAX_NUMBER) : 0; };
    const hypeLogin = (v) => cleanText(String(v ?? '')).trim().toLowerCase().slice(0, 40);
    const hypeName = (v, login) => displayName(v, 32) || login;
    function hypeTime(v) {                               // a start time as the milliseconds since 1970, or 0 when it is not one
        const t = typeof v === 'number' ? v : Date.parse(String(v ?? ''));
        return Number.isFinite(t) && t > 0 ? t : 0;
    }
    function fmtNum(n) {
        const v = hypeNum(n);
        try { return new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 }).format(v); } catch { return String(v); }
    }
    function fmtElapsed(ms) {
        const s = Math.max(0, Math.round((Number.isFinite(ms) ? ms : 0) / 1000));
        if (s > 86400) return '24h+';
        if (s < 60) return s + 's';
        const m = Math.floor(s / 60);
        return m >= 60 ? Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm' : m + 'm ' + String(s % 60).padStart(2, '0') + 's';
    }

    function hypeReset(h, id, startedAt, level) {
        h.id = id; h.active = true; h.ended = false; h.endedBy = ''; h.seen = Date.now(); h.startedAt = startedAt; h.level = level;
        h.otherBits = 0; h.users.clear(); h.conductor = ''; h.conductorName = ''; h.conductorBits = 0;
        h.subConductor = ''; h.subConductorName = ''; h.subConductorPoints = 0;
    }

    // Adds bits to a cheerer in the tally (exact = false), or lifts the cheerer to at least `bits` (exact = true: Twitch's own figure)
    function hypeCredit(h, login, name, bits, exact) {
        if (!login || !(bits > 0)) return;
        const e = h.users.get(login) || { name: name || login, bits: 0 };
        if (exact) { if (bits > e.bits) e.bits = bits; } else e.bits += bits;
        if (name) e.name = name;
        h.users.set(login, e);
        if (h.users.size > HYPE_MAX_USERS) {            // keep the generous ones: the smallest cheerer is folded into "other"
            let lowKey = null, low = Infinity;
            for (const [k, v] of h.users) if (k !== login && v.bits < low) { low = v.bits; lowKey = k; }
            if (lowKey !== null) { h.otherBits += low; h.users.delete(lowKey); }
        }
    }

    function hypeTotal(h) {
        let total = h.otherBits;
        for (const e of h.users.values()) total += e.bits;
        return total;
    }

    // the tally, most generous first (a tie keeps the order the cheerers came in)
    const hypeRanked = (h) => Array.from(h.users, ([login, e]) => ({ login, name: e.name, bits: e.bits })).sort((a, b) => b.bits - a.bits);

    // A cheer while a train is on. Only a real Cheer event counts: the dock's test cheers have no part in a train.
    function hypeObserveCheer(d) {
        const h = hypeLive;
        if (!h.active) return;
        if (Date.now() - h.seen > HYPE_STALE_MS) { h.active = false; return; }
        const bits = hypeNum(d.bits);
        if (!bits) return;
        const login = hypeLogin(d.userName);
        if (!login || ANONYMOUS_LOGIN.test(login)) h.otherBits += bits;
        else hypeCredit(h, login, hypeName(d.user, login), bits, false);
    }

    // The top cheerer of an event, as Twitch reports it
    function hypeTop(d) {
        const login = hypeLogin(d['top.bits.userName']);
        return { login, name: hypeName(d['top.bits.user'], login), bits: hypeNum(d['top.bits.total']) };
    }

    // The top sub gifter of an event, as Twitch reports it. The figure is in points. Twitch counts a Tier 1 gift sub as 500 points, a Tier 2 one as 1,000
    // and a Tier 3 one as 2,500. A receipt says gift subs, so it divides by 500 (a Tier 3 gift sub shows as 5), and any figure above zero is at least one.
    function hypeSubTop(d) {
        const login = hypeLogin(d['top.subscription.userName']);
        return { login, name: hypeName(d['top.subscription.user'], login), points: hypeNum(d['top.subscription.total']) };
    }
    const hypeSubs = (points) => Math.max(1, Math.round(points / HYPE_SUB_POINTS));
    function hypeSubText(points, long) {
        const n = hypeSubs(points);
        return `${fmtNum(n)} ${long ? 'gift sub' : 'sub'}${n === 1 ? '' : 's'}`;
    }

    // Which train an event belongs to. A Start event always begins a new tally. Any other event begins one only when no train is on, when
    // the last one has been silent for too long, or when its id is another train's (the Start event was missed, or a train ended unseen).
    function hypeEnter(d, kind) {
        const id = String(d.id ?? '').slice(0, 100), level = Math.floor(hypeNum(d.level)), now = Date.now();
        // A train whose end receipt the clock printed (the End event did not come, see the C# side) and that speaks again was still going: its tally is taken up again.
        if (kind !== 'start' && hype.ended && hype.endedBy === 'clock' && id !== '' && id === hype.id && now - hype.seen <= HYPE_RESUME_MS) {
            hype.active = true; hype.ended = false; hype.endedBy = '';
            if (level > hype.level) hype.level = level;
            hype.seen = now;
            return;
        }
        const fresh = kind === 'start' || !hype.active || now - hype.seen > HYPE_STALE_MS || (id !== '' && hype.id !== '' && id !== hype.id);
        if (fresh) hypeReset(hype, id, hypeTime(d.startedAt) || now, level);
        else if (level > hype.level) hype.level = level;
        hype.seen = now;
    }

    // Does this event change who the conductor is? Returns { kind: 'new' } for the first conductor, { kind: 'switch', was } for another one
    // (was: the conductor before, with the bits that conductor had), and null for no change. The caller prints a receipt for a change.
    function hypeConductor(h, top) {
        if (!top.login || !(top.bits > 0)) return null;                      // nobody has cheered yet
        hypeCredit(h, top.login, top.name, top.bits, true);
        if (!h.conductor) { h.conductor = top.login; h.conductorName = top.name; h.conductorBits = top.bits; return { kind: 'new' }; }
        if (top.login === h.conductor) { h.conductorBits = Math.max(h.conductorBits, top.bits); h.conductorName = top.name || h.conductorName; return null; }
        const mine = h.users.get(h.conductor);
        const was = { login: h.conductor, name: h.conductorName, bits: Math.max(h.conductorBits, mine ? mine.bits : 0) };
        h.conductor = top.login; h.conductorName = top.name; h.conductorBits = top.bits;
        return { kind: 'switch', was };
    }

    // The same question for the Gift Sub Conductor: { kind: 'new' }, { kind: 'switch', was } (was: the Conductor before, with the points that Conductor had)
    // or null. `announce` is false while the same event already makes a receipt for the Bits Conductor. A change is then left as it is, and the next Update
    // finds it again, so that each receipt names one Conductor.
    function hypeSubConductor(h, top, announce) {
        if (!top.login || !(top.points > 0)) return null;                    // nobody has gifted yet
        if (!h.subConductor) {
            if (!announce) return null;
            h.subConductor = top.login; h.subConductorName = top.name; h.subConductorPoints = top.points;
            return { kind: 'new' };
        }
        if (top.login === h.subConductor) { h.subConductorPoints = Math.max(h.subConductorPoints, top.points); h.subConductorName = top.name || h.subConductorName; return null; }
        if (!announce) return null;
        const was = { login: h.subConductor, name: h.subConductorName, points: h.subConductorPoints };
        h.subConductor = top.login; h.subConductorName = top.name; h.subConductorPoints = top.points;
        return { kind: 'switch', was };
    }

    // Which kind of train an event is about: 'regular', 'treasure' or 'golden_kappa'. Streamer.bot says it as trainType and as two flags. The receipt's drawing
    // (the engine, the rail car, the caboose) and the word on the Start receipt follow it.
    function hypeKind(d) {
        const t = String(d.trainType ?? '').toLowerCase();
        if (own(HYPE_TYPE_NAMES, t)) return t;
        const yes = (v) => v === true || String(v).toLowerCase() === 'true';
        return yes(d.isGoldenKappaTrain) ? 'golden_kappa' : yes(d.isTreasureTrain) ? 'treasure' : 'regular';
    }
    const hypeTypeName = (d) => HYPE_TYPE_NAMES[hypeKind(d)];

    // what a test can look at of a train's state
    const hypeSummary = (h) => ({ id: h.id, active: h.active, ended: h.ended, endedBy: h.endedBy, level: h.level, conductor: h.conductor, conductorBits: h.conductorBits,
                                  subConductor: h.subConductor, subConductorPoints: h.subConductorPoints, cheerers: h.users.size, total: hypeTotal(h), stage: h.stage });

    const hypeRow = (label, value) => `<div class="hype-row"><span>${label}</span><b>${value}</b></div>`;
    const hypeRows = (html) => ({ kind: 'rows', html, left: true });

    // A Conductor receipt: the cap on the avatar, the name and the figure. For a change of Conductor it also says whose cap it was. `label` is the title
    // of the Conductor ('Bits Conductor' or 'Gift Sub Conductor', fixed text), `who` the new Conductor, `amount` the figure as text ('1,320 bits'), `change`
    // what hypeConductor or hypeSubConductor returned and `wasAmount` the figure of the one who lost the cap.
    async function hypeCapReceipt(label, who, amount, change, wasAmount) {
        const switched = change.kind === 'switch';
        return {
            bannerHtml: ART.cap, bannerClass: 'cap',
            avatar: await getAvatar(who.login, 'twitch'),
            title: (switched ? 'New ' : '') + label, subtitle: who.name,
            content: [lead(esc(amount)),
                      switched ? text(`took the cap from<br><b>${esc(change.was.name)}</b> (${esc(wasAmount)})`) : text(`is the ${label} of the Hype Train!`)],
            icon: 'twitch',
        };
    }
    const hypeConductorReceipt = (top, change) => hypeCapReceipt('Bits Conductor', top, `${fmtNum(top.bits)} bits`, change, change.was ? `${fmtNum(change.was.bits)} bits` : '');
    const hypeSubConductorReceipt = (top, change) => hypeCapReceipt('Gift Sub Conductor', top, hypeSubText(top.points, true), change, change.was ? hypeSubText(change.was.points, true) : '');

    // One Conductor under a heading with the cap, for the Level up and End receipts. `name` is empty when nobody has the cap: `none` says so.
    const hypeConductorBlock = (label, name, amount, none) =>
        hypeRows(`<div class="hype-head"><span class="hype-cap">${ART.cap}</span>${label}</div>` + (name ? hypeRow(esc(name), esc(amount)) : hypeRow(none, '')));

    // ---- the dock's Hype Train test prints ----
    // Six steps, the six receipts of a train in order: it starts, a first Bits Conductor, a new Bits Conductor, a Gift Sub Conductor, a level up, it ends.
    // Each step is a test print of its own. Run in a row (the dock's end-to-end test: the C# side runs these six names one after the other) they share one
    // test train, so the tally and the Conductors carry from step to step like those of a real train. A step run alone, or out of turn, first
    // starts a test train and replays what the steps before it did (silently), so it prints the same receipt as in the full run.
    // `cheers` are the cheers that happen before the step's event: [login, name, bits]. The cast has logins with a dot, which no Twitch
    // login has, so no picture is looked up for them. Only SassyTP gets one. `top` is the top cheerer the step's event reports and `sub` the top
    // sub gifter: [login, name, points].
    const HYPE_SAMPLE_ID = 'sample-train';
    const HYPE_SOURCES = { start: 'TwitchHypeTrainStart', update: 'TwitchHypeTrainUpdate', levelup: 'TwitchHypeTrainLevelUp', end: 'TwitchHypeTrainEnd' };
    const HYPE_STEPS = [
        { name: 'TwitchHypeTrainStart', kind: 'start', age: 0, level: 1, cheers: [], top: null },
        { name: 'TwitchHypeTrainConductor', kind: 'update', age: 70000, level: 1, top: ['sample.viewer01', 'Viewer01'],
          cheers: [['sample.viewer01', 'Viewer01', 600], ['sample.viewer02', 'Viewer02', 450], ['sample.viewer03', 'Viewer03', 300]] },
        { name: 'TwitchHypeTrainConductorSwitch', kind: 'update', age: 190000, level: 1, top: ['sassytp', 'SassyTP'],
          cheers: [['sassytp', 'SassyTP', 800], ['sample.viewer04', 'Viewer04', 200]] },
        { name: 'TwitchHypeTrainSubConductor', kind: 'update', age: 262000, level: 1, top: ['sassytp', 'SassyTP'], sub: ['sample.gifter01', 'Gifter01', 1500],
          cheers: [] },
        { name: 'TwitchHypeTrainLevelUp', kind: 'levelup', age: 372000, level: 2, top: ['sassytp', 'SassyTP'], sub: ['sample.gifter01', 'Gifter01', 2500],
          cheers: [['sample.viewer02', 'Viewer02', 250]] },
        { name: 'TwitchHypeTrainEnd', kind: 'end', age: 570000, level: 2, top: ['sassytp', 'SassyTP'], sub: ['sample.gifter01', 'Gifter01', 3500],
          cheers: [['sample.viewer05', 'Viewer05', 120]] },
    ];
    const HYPE_SAMPLE_TYPES = ['regular', 'treasure', 'golden_kappa'];
    let hypeSampleTurn = 0;                            // the Start sample shows the three kinds of train in turn

    function hypeTopOfStep(step) {
        const e = step.top ? hypeTest.users.get(step.top[0]) : null;
        return step.top ? { login: step.top[0], name: step.top[1], bits: e ? e.bits : 0 } : { login: '', name: '', bits: 0 };
    }
    const hypeSubTopOfStep = (step) => step.sub ? { login: step.sub[0], name: step.sub[1], points: step.sub[2] } : { login: '', name: '', points: 0 };

    function hypeSampleStep(i) {
        const t = hypeTest, step = HYPE_STEPS[i];
        if (i === 0 || t.id !== HYPE_SAMPLE_ID || !t.active || t.stage !== i) {
            if (i === 0) t.sampleType = HYPE_SAMPLE_TYPES[hypeSampleTurn++ % HYPE_SAMPLE_TYPES.length];
            hypeReset(t, HYPE_SAMPLE_ID, Date.now() - step.age, 1);
            t.stage = 0;
            for (let k = 1; k < i; k++) {              // replay the steps before this one
                const before = HYPE_STEPS[k];
                for (const c of before.cheers) hypeCredit(t, c[0], c[1], c[2], false);
                if (before.kind === 'update') { const announced = hypeConductor(t, hypeTopOfStep(before)); hypeSubConductor(t, hypeSubTopOfStep(before), !announced); }
                if (before.kind === 'levelup') t.level = before.level;
                t.stage = k + 1;
            }
            t.stage = Math.max(t.stage, i);
        }
        for (const c of step.cheers) hypeCredit(t, c[0], c[1], c[2], false);
        const ev = { __source: HYPE_SOURCES[step.kind], id: HYPE_SAMPLE_ID, level: step.level, startedAt: new Date(t.startedAt).toISOString(), trainType: t.sampleType };
        if (step.top) {
            const top = hypeTopOfStep(step);
            ev['top.bits.userName'] = top.login; ev['top.bits.user'] = top.name; ev['top.bits.total'] = top.bits;
        }
        if (step.sub) {
            const sub = hypeSubTopOfStep(step);
            ev['top.subscription.userName'] = sub.login; ev['top.subscription.user'] = sub.name; ev['top.subscription.total'] = sub.points;
        }
        t.stage = i + 1;
        return ev;
    }

    // The months on a subscription receipt. Streamer.bot sends three separate numbers: cumulative (every month the viewer has subscribed),
    // monthStreak (the months in a row) and multiMonthDuration (the length of a plan paid in advance, 3, 6 or 12). Each one gets its own line
    // when it applies. Only a number or numeric text counts (a list such as [6] would turn into 6), and what goes into the HTML is the whole
    // number itself, so nothing else from the event reaches it.
    function wholeMonths(v) {
        const n = typeof v === 'number' || typeof v === 'string' ? Math.trunc(Number(v)) : NaN;
        return n >= 1 && n < 10000 ? n : 0;
    }
    // The number and its unit stay on one line, and a total of one month reads "1 month".
    const monthsHtml = (n, end) => `<b>${n}&nbsp;${n === 1 ? 'month' : 'months'}${end || ''}</b>`;
    // A plain monthly subscription sends 1 or nothing as the length of the plan and gets no prepaid line.
    function prepaidRow(d) {
        const months = wholeMonths(d.multiMonthDuration);
        return months > 1 && months < 1000 ? stat(`Prepaid in advance: ${monthsHtml(months, '!')}`) : null;
    }
    function subscriptionRows(d) {
        const total = wholeMonths(d.cumulative);
        const streak = wholeMonths(d.monthStreak);
        return [total ? stat(`Total time subscribed: ${monthsHtml(total)}`) : null,
                streak > 1 ? stat(`Current streak: ${monthsHtml(streak)}`) : null,
                prepaidRow(d)];
    }

    const HANDLERS = {

        // ---- Twitch ----------------------------------------------------
        async TwitchCheer(d, opts) {
            // High Roller: at or above the dock's threshold the message is used as-is (styling, rotated text). Below it, the message is cleaned like any other viewer text.
            // A High Roller cheer carries its message twice: as styled content, and as the plain message that a printer gets when it does not allow High Roller prints (options.allowHighRoller
            // false, see viewOf). The length limit is worked out when the receipt is shown, because it is a length of paper and the paper differs from printer to printer.
            // 3.0.4: the cheermotes are taken out first (cheerWords): they are the bits, which the title shows.
            const said = cheerWords(d.message);
            const raw = !!said && isHighRoller(d.bits, opts);
            const content = !said ? null : raw ? { kind: 'raw', rich: said } : message(said);
            return {
                avatar: await getAvatar(d.userName, 'twitch'),
                title: `${displayName(d.bits, 12)} BITS`, subtitle: displayName(d.user), content, icon: 'twitch',
                highRoller: raw ? { bits: d.bits } : null, contentPlain: raw ? message(said) : null, largePage: isHighRoller(d.bits, opts),
            };
        },
        async TwitchRewardRedemption(d) {
            const cost = d.rewardCost ?? 1;
            return {
                avatar: await getAvatar(d.userName, 'twitch'),
                title: `${displayName(cost, 12)} CHANNEL POINT${cost === 1 ? '' : 'S'}`,
                subtitle: `${displayName(d.userName)} redeemed a ${displayName(d.rewardName)}!`,
                content: d.rawInput ? message(d.rawInput) : null,
                icon: 'twitch',
            };
        },
        async TwitchSub(d) {
            return {
                avatar: await getAvatar(d.userName, 'twitch'),
                title: `${displayName(d.tier, 24)} subscriber`, subtitle: displayName(d.user),
                content: [lead('First time subscriber!'), prepaidRow(d)], icon: 'twitch',
            };
        },
        async TwitchReSub(d) {
            return {
                avatar: await getAvatar(d.userName, 'twitch'),
                title: `${displayName(d.tier, 24)} subscriber`, subtitle: displayName(d.user), icon: 'twitch',
                content: [...subscriptionRows(d), message(d.messageStripped)],
            };
        },
        async TwitchGiftSub(d) {
            if (d.fromGiftBomb) return null;     // the gift bomb prints one receipt for all of them
            const gifter = d.anonymous ? 'A mysterious admirer' : nm(d.user);
            return {
                avatar: await getAvatar(d.recipientUserName, 'twitch'),
                title: 'Gifted Sub',
                content: text(`<b>${gifter}</b><br>gifted a ${nm(d.tier, 24)} sub to<br><b>${nm(d.recipientUser)}</b>`),
                icon: 'twitch', largePage: true,
            };
        },
        async TwitchGiftBomb(d) {
            // Streamer.bot sends one key per recipient, gift.recipientUser0, gift.recipientUser1 and so on. Its Test button sends none.
            // Every name that arrives prints, however many there are. Gift subs are paid for, and a long list is a long receipt.
            // The list follows the number in the key (recipientUser2 before recipientUser10). The order the keys arrive in is not promised,
            // and the sort is stable, so keys with the same number keep the order they came in.
            const keys = Object.keys(d).filter(k => /^gift\.recipientUser\d+$/.test(k)).sort((a, b) => Number(a.slice(18)) - Number(b.slice(18)));
            const recipients = keys.map(k => nm(d[k]));
            const gifts = Number(d.gifts);
            // Names that were counted but never sent (the bomb says 50 gifts but only 30 names came with it)
            const unlisted = keys.length && Number.isFinite(gifts) && gifts > keys.length ? gifts - keys.length : 0;
            const listed = recipients.slice(), tail = unlisted > 0 ? `…and ${nm(unlisted, 12)} more` : null;
            if (tail) recipients.push(tail);
            return {
                avatar: await getAvatar(d.userName, 'twitch'),
                titleHtml: `${nm(d.gifts, 12)} × Gifted Subs`,
                subtitle: d.anonymous ? 'A mysterious admirer' : displayName(d.user),
                content: [lead(nm(cap(d.tier), 24)),
                          d.totalGifts > 1 ? text(`They've gifted <b>${nm(d.totalGifts, 12)} subs</b> in total!`) : null,
                          recipients.length ? { kind: 'text', html: recipients.join('<br>'), roomy: true, list: { items: listed, tail, more: unlisted, perPage: NAMES_PER_PAGE } } : null],
                icon: 'twitch', largePage: true,
            };
        },
        async TwitchRaid(d) {
            return {
                avatar: await getAvatar(d.userName, 'twitch'),
                title: 'Incoming Raid', subtitle: displayName(d.user),
                content: text(`is raiding with a party of<br><b>${nm(d.viewers, 12)} viewers!</b>`),
                icon: 'twitch',
            };
        },
        // ---- Twitch: Hype Train (the section above says how a train is followed) ----
        async TwitchHypeTrainStart(d) {
            hypeEnter(d, 'start');
            const top = hypeTop(d);
            hypeCredit(hype, top.login, top.name, top.bits, true);               // the cheers that started the train count. The first Update announces the conductor
            return {
                bannerHtml: ART.engine(hypeKind(d)),                                 // above the header: the first thing on the receipt, front toward its top
                title: 'Hype Train', subtitle: 'All aboard!',
                content: hypeRows(hypeRow('Started', esc(formatClock(new Date(hype.startedAt)))) + hypeRow('Train', esc(hypeTypeName(d)))),
                icon: 'twitch',
            };
        },
        async TwitchHypeTrainUpdate(d) {
            hypeEnter(d, 'update');
            const bits = hypeTop(d), subs = hypeSubTop(d);
            const bitsChange = hypeConductor(hype, bits);
            const subsChange = hypeSubConductor(hype, subs, !bitsChange);        // one receipt names one Conductor: a second change waits for the next Update
            if (bitsChange) return hypeConductorReceipt(bits, bitsChange);
            return subsChange ? hypeSubConductorReceipt(subs, subsChange) : null;    // most updates change nothing, and print nothing
        },
        async TwitchHypeTrainLevelUp(d) {
            hypeEnter(d, 'levelup');
            const top = hypeTop(d), subs = hypeSubTop(d);
            hypeCredit(hype, top.login, top.name, top.bits, true);               // a change of conductor in this update is announced by the next Update
            const level = hypeNum(d.level) || hype.level;
            // the two Conductors as Twitch says them now, or as they were announced when the event names none
            const bitsNow = top.login && top.bits > 0 ? top : (hype.conductor ? { name: hype.conductorName, bits: hype.conductorBits } : null);

    // the gaps around the header and the footer. Each gap can give back at most the number of px in GAP_ROOM (the letters are the variables of receipt.css:
    // a under the picture, c above and d below the rule under the header, e above and f below the rule in the footer, g under the logo, h under the date).
    // A receipt gives back exactly what its picture gained, shared out among the gaps it has in proportion to their rooms and in whole px. All the lengths are
    // whole px, so the page height comes out the same as before to the last row. A gap that a receipt does not have (no content: no rule under the header,
    // no logo: no space around it) takes no part and the others give a little more.
    const OLD_AVATAR_PX = 184;                                   // 11.5em, the size before the picture was enlarged. The page height is held to what it was with this
    const GAP_ROOM = { a: 10, c: 10, d: 10, e: 10, f: 10, g: 4, h: 12 };

    // How many px each of the named gaps gives back so that `total` px are found in all. rooms: name -> most px it can give. Pure: the result holds whole numbers,
    // their sum is `total` (or the sum of all the rooms when that is less), and none is above its room. The leftover px of the rounding go to the largest remainders.
    function shareCuts(total, rooms) {
        const names = Object.keys(rooms);
        const room = names.reduce((sum, n) => sum + rooms[n], 0);
        const goal = Math.min(Math.max(0, Math.round(Number(total) || 0)), room);
        const cuts = {};
        if (room === 0) return cuts;
        let given = 0;
        const rest = [];
        for (const n of names) {                                   // the exact share is goal * room / all the rooms: whole px and a remainder, both integers, so ties are exact
            const share = goal * rooms[n];
            cuts[n] = Math.floor(share / room);
            given += cuts[n];
            rest.push({ n, frac: share % room });

        rest.sort((x, y) => y.frac - x.frac || names.indexOf(x.n) - names.indexOf(y.n));

    function clearGaps() {
