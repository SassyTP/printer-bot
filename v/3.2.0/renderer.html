    }

    // 3.2.0: the sticker layout, once the receipt is built (show): the kind of the event goes into the head after the picture (the head is a reversed row, so it reads right to left:
    // the picture, the kind, the amount, the name, the time), and the pictures of the message leave the message box for a box of their own under the frame of the words, each as wide
    // as the tape (the stylesheet; stickerPictures tidies the box once they have loaded, present).
    function stickerArrange(content, model, opts) {
        const header = $('receipt-header'), avatar = $('receipt-avatar');
        const kind = document.createElement('div');
        kind.id = 'receipt-kind';
        // the first line beside the picture: the kind of the event and the amount ("Twitch Cheer · 100 bits"); the amount's own line (#receipt-title) is hidden by the stylesheet
        const kindText = model.highRoller && model.highRoller.youtube ? STICKER_KINDS.youtube : (STICKER_KINDS[model.icon] || '');
        const amount = ($('receipt-title').textContent || '').trim().replace(/\bBITS\b/, 'bits');
        kind.textContent = kindText + (amount ? ' \u00b7 ' + amount : '');
        header.insertBefore(kind, avatar.nextSibling);
        hoistSitePictures(content, opts, true);                                                 // the pictures of the sites, out of the styled text (as in the large layout)
        const pics = Array.from(content.querySelectorAll(':scope > .part.pictures'));
        const imgs = [];
        for (const part of pics) { pictureItems(part, imgs); part.remove(); }
        const mark = $('receipt-test-mark');
        if (!imgs.length) { if (mark) $('receipt-container').appendChild(mark); return; }      // 3.2.0-beta.2: a sticker shows no footer: the TEST mark of a test print goes to its end
        const box = document.createElement('div');
        box.id = 'receipt-sticker-pictures';
        for (const img of imgs) {
            const wrap = document.createElement('div');
            wrap.className = 'sticker-pic';
            if (img.style) img.style.removeProperty('max-height');                             // the limit of a roll (MAX_MESSAGE_IMAGE_INCHES): a sticker's picture is as wide as the tape, whatever its height
            wrap.appendChild(img);
            box.appendChild(wrap);
        }
        $('receipt-container').appendChild(box);
        if (mark) $('receipt-container').appendChild(mark);
    }

    function cardArrange(content, model, opts) {
        const header = $('receipt-header'), avatar = $('receipt-avatar'), container = $('receipt-container');
        const kind = document.createElement('div');
        kind.id = 'receipt-kind';
        kind.textContent = model.highRoller && model.highRoller.youtube ? STICKER_KINDS.youtube : (STICKER_KINDS[model.icon] || '');
        header.insertBefore(kind, avatar.nextSibling);
        const mark = $('receipt-test-mark');
        if (mark) header.appendChild(mark);                                        // a card shows no footer: the TEST mark of a test print goes to the end of the head
        hoistSitePictures(content, opts, true);                                    // the pictures of the sites, out of the styled text (as in the large layout)
        const imgs = [];
        for (const part of Array.from(content.querySelectorAll(':scope > .part.pictures'))) { pictureItems(part, imgs); part.remove(); }
        if (!imgs.length) { container.classList.add('card-words'); return; }
        const box = document.createElement('div');
        box.id = 'receipt-card-pictures';
        for (const img of imgs) {
            const wrap = document.createElement('div');
            wrap.className = 'card-pic';
            if (img.style) img.style.removeProperty('max-height');                 // the limit of a roll (MAX_MESSAGE_IMAGE_INCHES): on a card a picture takes its share of the card
            wrap.appendChild(img);
            box.appendChild(wrap);
        }
        container.appendChild(box);
    }

    // 3.2.0-beta.8 (the audit of 19 October): what a part of pictures holds for a sticker or a card, in its order: its pictures, and the words [image] of an address that failed a moment
    // ago (messageImageElement), which get a box of their own as a picture that did not come does (before, only the pictures were taken and those words were lost)
    function pictureItems(part, items) {
        const walker = document.createTreeWalker(part, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
        while (walker.nextNode()) {
            const n = walker.currentNode;
            if (n.nodeType === Node.TEXT_NODE ? badImageTexts.has(n) : n.matches('img.msg-image')) items.push(n);
        }
    }

    // The pictures of a card, once loaded: a box that holds nothing at all is taken away (a picture that did not come keeps "[image]" in its box, as on a roll), and a card that is left
    // with no picture gets the layout of a card with none (card-words)
    function cardPictures() {
        const box = $('receipt-card-pictures');
        if (!box) return;
        for (const wrap of Array.from(box.children)) if (!wrap.querySelector('img.msg-image') && wrap.textContent.trim() === '') wrap.remove();
        if (!box.children.length) { box.remove(); $('receipt-container').classList.add('card-words'); }
    }

    // The words of a card shrink until they fit their place (the column at the left, or the rest of the card when there is no picture; a High Roller limit of the dock, a max-height of the
    // box, makes the place smaller), down to CARD_MIN_WORDS_PX; what still does not fit is cut, and fades out like every other cut. The parts are zoomed, not given a smaller type: a
    // styled message carries sizes of its own. Returns what was cut as present() reports it, or null. by: what the High Roller limit of the box is ('bits', 'amount' or 'cap'; null: none).
    function cardWords(opts, by) {
        const box = $('receipt-content');
        const fits = () => box.scrollHeight <= box.clientHeight + 1;
        const base = parseFloat(getComputedStyle(box).fontSize) || 10;
        let zoom = 1;
        while (!fits() && base * zoom > CARD_MIN_WORDS_PX + 0.01) {
            zoom = Math.max(CARD_MIN_WORDS_PX / base, zoom * 0.9);
            for (const part of Array.from(box.children)) part.style.zoom = String(zoom);
        }
        if (fits()) return null;
        box.classList.add('cut');
        const inches = (px) => Math.round(px / pxPerInch(opts) * 100) / 100;
        // 3.2.0-beta.8 (the audit of 19 October): the limit of the dock cut the words when it made their place smaller than the card gives them (the place with the max-height of the
        // limit taken away); the end of the card did otherwise. Before, a card always said 'page'.
        let cutBy = 'page';
        const limit = box.style.getPropertyValue('max-height');
        if (by && limit) {
            const shown = box.clientHeight;
            box.style.removeProperty('max-height');
            const place = box.clientHeight;
            box.style.setProperty('max-height', limit, 'important');
            if (place > shown + 1) cutBy = by === 'cap' || by === 'amount' ? by : 'bits';
        }
        return { limitIn: inches(box.clientHeight), fullIn: inches(box.scrollHeight), by: cutBy };
    }

    // The receipt of an 80 mm roll on a card (layout 'cardfit'): drawn as on the roll (applyLayout gave it the roll's width), it is made as large as the card allows, upright, and put in the
    // middle of the card. Returns the share of its size it was made smaller to, in percent (1 to 99), or 0 when it kept its size or was made larger.
    function cardFit(opts) {
        const container = $('receipt-container');
        const cardW = Math.max(1, document.documentElement.clientWidth), cardH = opts.cardPagePx;
        const r = container.getBoundingClientRect();
        const w = Math.max(1, r.width), h = Math.max(1, r.height);
        const scale = Math.min(cardW / w, cardH / h);
        const x = (cardW - w * scale) / 2 - r.left, y = (cardH - h * scale) / 2 - r.top;
        container.style.transformOrigin = '0 0';
        container.style.transform = 'translate(' + x + 'px, ' + y + 'px) scale(' + scale + ')';
        return scale < 0.995 ? Math.max(1, Math.round(scale * 100)) : 0;
    }

    // 3.2.0-beta.9: the receipt of an 80 mm roll on a sticker printer (layout 'stickerfit'): drawn as on the roll (applyLayout gave it the roll's width), it is made as wide as the tape (the
    // page's width), every part at the same share, from the top left corner. Returns the length of the sticker then, in whole CSS px. It is not reported as made smaller (`fit`): on a
    // sticker this is the layout of every such receipt, and the action's line for a receipt made smaller speaks of a page of Letter paper or a card.
    function stickerFit() {
        const container = $('receipt-container');
        const scale = Math.max(1, document.documentElement.clientWidth) / Math.max(1, container.getBoundingClientRect().width);
        container.style.transformOrigin = '0 0';
        container.style.transform = 'scale(' + scale + ')';
        return Math.max(1, Math.ceil(container.getBoundingClientRect().bottom));
    }

    // The pictures of a sticker, once loaded: each one is drawn as wide as the tape in its own orientation (the stylesheet), so nothing is left to do for a picture that came. A picture
    // that did not come (dropMessageImage made it the text "[image]") keeps its box with those words, as on a roll; a box that holds nothing at all is taken away.
    function stickerPictures() {
        const box = $('receipt-sticker-pictures');
        if (!box) return;
        for (const wrap of Array.from(box.children)) if (!wrap.querySelector('img.msg-image') && wrap.textContent.trim() === '') wrap.remove();
        if (!box.children.length) box.remove();
    }

    // 3.0.4: a receipt that the dock's test print made from values the person typed says TEST at the bottom of its footer (the owner's choice: such a receipt can never pass for a
    // real one). The action decides it (options.testMark, exactly true); event data cannot. Every receipt starts without the line, so it never stays for the next one.
    function testMark(opts) {
        const old = $('receipt-test-mark');
        if (old) old.remove();
        if (!(opts && opts.testMark === true)) return;
        const mark = document.createElement('div');
        mark.id = 'receipt-test-mark';
        mark.textContent = 'TEST';
        $('receipt-footer').appendChild(mark);
    }

    // Builds the receipt from the model. Returns the avatar URL that is on the page ('' = none).
    function show(model, opts) {
        const avatar = $('receipt-avatar'), title = $('receipt-title'), subtitle = $('receipt-subtitle');
        const content = $('receipt-content'), icon = $('receipt-icon');

        // reset everything a previous receipt may have left behind
        avatar.removeAttribute('src'); avatar.style.display = ''; avatar.style.borderRadius = '';
        $('receipt-container').classList.remove('no-avatar');
        applyLayout(opts);
        title.className = ''; title.textContent = ''; subtitle.textContent = ''; content.textContent = '';
        const banner = $('receipt-banner'), tail = $('receipt-tail');
        banner.className = ''; banner.textContent = ''; tail.className = ''; tail.textContent = '';
        if (model.bannerHtml) {                                                   // our own drawings, never event data
            const slot = model.bannerAt === 'bottom' ? tail : banner;
            slot.innerHTML = model.bannerHtml;
            slot.className = slot === banner && model.bannerClass === 'cap' ? 'cap' : 'art';
        }
        content.style.maxHeight = ''; content.classList.remove('cut', 'roomy');
        content.style.setProperty('transition', 'none', 'important');       // a theme's max-height transition would make the limit lag a receipt behind

        let avatarUrl = safeAvatarUrl(model.avatar);                         // (a refused URL is noted in the log, with its host)
        if (avatarUrl && isBadImage(avatarUrl)) avatarUrl = '';              // this picture failed (or didn't load in time) a moment ago: don't wait for it again
        avatarStandIn = model.avatarPlaceholder === true;                    // only a handler sets it (event data cannot)
        if (!avatarUrl && avatarStandIn) avatarUrl = NO_PICTURE;
        if (avatarUrl === NO_PICTURE) avatar.src = NO_PICTURE;
        else if (avatarUrl) { const shown = pickAvatarImage(avatarUrl); pinImage(shown); avatar.src = shown; if (model.avatarSquare) avatar.style.borderRadius = '0px'; }       // (the larger picture, see largerAvatarUrl)
        else { avatar.style.display = 'none'; $('receipt-container').classList.add('no-avatar'); }

        if (model.titleBig) title.classList.add('big');
        if (model.titleHtml != null) title.innerHTML = model.titleHtml; else title.textContent = model.title ?? '';
        subtitle.textContent = model.subtitle ?? '';

        // content: one part or a list of parts ({ kind: text | lead | message | raw, left } plus html | text | rich).
        // Nothing = no content area
        const view = viewOf(model, opts);
        const parts = [].concat(view.content || []).filter(Boolean)
            .map(p => p.kind === 'message' && p.value != null ? messagePart(p.value, opts) : p)
            .filter(p => p.html || p.text || p.rich);
        $('receipt-rule-top').style.display = parts.length ? '' : 'none';
        content.style.display = parts.length ? '' : 'none';
        // Gift lists and the item list of an order get a box with no height limit (a viewer's message keeps its 1600 px box, see receipt.css), and render()
        // returns their real page height. Our own code builds them from cleaned names and product labels, and an order lists at most MAX_VARIANTS items.
        // Only a handler can set roomy, so event data cannot ask for it.
        if (parts.some(p => p.roomy === true)) content.classList.add('roomy');
        // The built-in ceiling (1600 px in receipt.css, 16.7 inches of a roll) is a length of paper, so it follows the paper: on Letter paper, where an inch is fewer CSS px, it is
        // 16.7 inches of the page as well. The CSS cannot know the paper, so the box is given the scaled ceiling here.
        const ceiling = getComputedStyle(content).maxHeight;
        const ceilingScale = pxPerInch(opts) / PX_PER_INCH;
        const ceilingScaled = /px$/.test(ceiling) ? parseFloat(ceiling) * ceilingScale : Infinity;
        if (view.maxPx != null) {
            // The bits-per-inch limit can only tighten the box: the built-in ceiling (or a larger/smaller one set in theme.css) still applies.
            // The dock's maximum length is the final word, so when it is set (view.ignoreCeiling) it replaces that ceiling.
            // Applied as !important so a theme's own "max-height: ... !important" can't quietly switch the limit off.
            content.style.setProperty('max-height', Math.min(view.maxPx, view.ignoreCeiling ? Infinity : ceilingScaled) + 'px', 'important');
        }
        else if (ceilingScale !== 1 && Number.isFinite(ceilingScaled)) content.style.setProperty('max-height', ceilingScaled + 'px', 'important');
        const sites = enabledImageSites(opts);                             // 3.0.1: a picture comes only from a High Roller message (a part with rich content), and only while that part is built
        const lookups = lookupsOf(opts);                                   // 3.0.11, 3.1.0: the pictures the action looked up for the links of the message (albums, ImgBB pages)
        try {
            for (const p of parts) {
                const div = document.createElement('div');
                div.className = 'part ' + (p.kind || 'text') + (p.left ? ' left' : '');
                if (p.rich != null) { activeImageSites = sites; activeLookups = lookups; const rich = sanitizeRich(p.rich); pictureLinksInRich(rich, opts); activeImageSites = new Set(); activeLookups = NO_LOOKUPS; div.appendChild(rich); }     // High Roller: the allow-listed copy goes in, the original markup stays out
                else if (p.list && (pageHeightPx(opts) !== null || p.list.perPage > 0)) fillList(div, p.list, pageHeightPx(opts) !== null, p.html);     // a gift list or an order on Letter paper, a gift list on a roll: names that present() sets in columns (fitNames, rollColumns)
                else if (p.text != null) div.textContent = p.text;             // viewer text: text only
                else div.innerHTML = p.html;                                   // our own templates (viewer values already cleaned and esc()'d)
                content.appendChild(div);
            }
        } finally { activeImageSites = new Set(); activeLookups = NO_LOOKUPS; }
        if (largeLayoutPx(opts) !== null) hoistSitePictures(content, opts);
        if (stickerLayoutOn(opts)) stickerArrange(content, model, opts);          // 3.2.0
        if (cardLayoutOn(opts)) cardArrange(content, model, opts);                // 3.2.0-beta.2

        const hasIcon = !!(model.icon && ICONS[model.icon]);
        if (hasIcon) icon.src = ICONS[model.icon]; else icon.removeAttribute('src');
        $('receipt-date').textContent = formatDate(new Date());
        if (avatarUrl) tightenGaps(parts.length > 0, hasIcon); else clearGaps();       // the larger picture takes its height out of the gaps (see above)
        return avatarUrl;
    }

    // ---- a list of names on a page of Letter paper (3.0.0) ----------------------------------------------------------------------------------
    // A gift list or the items of an order is a list of names. On a roll it is one column, as long as it comes. On a page of Letter paper (one page, always) it is set in columns and a
    // smaller type, as many as it takes to fit: up to NAMES_PER_PAGE gift names fit one page, more go on to the next page, 100 to a page (3.0.2, large layout: the first page 100 and every page
    // after it as many as fit at the type of the first, which has no header to make room for, and the platform logo is at the bottom of every page, see addPageLogos). An order
    // is held to one page and cut at its end (the page cut of present()) if the densest step still does not fit it. The names are our own, cleaned and escaped by the handlers; the list a
    // handler gives is the only way in, so event data cannot ask for columns or pages.
    // The steps go from the largest type to the smallest, and for one size from the fewest columns to the most, so the first step that fits is the largest type that does (0.42 is about 9 pt on paper).
    const NAME_SIZES = [1, 0.9, 0.8, 0.72, 0.65, 0.58, 0.52, 0.47, 0.42], NAME_MAX_COLUMNS = 6;
    const NAME_STEPS = [];
    for (const size of NAME_SIZES) for (let cols = 1; cols <= NAME_MAX_COLUMNS; cols++) NAME_STEPS.push([cols, size, size === 1 ? 'inherit' : '1.2']);
    const NAME_PAGE_PAD = 6, NAME_PAGE_RESERVE = 6;         // blank CSS px at the top of a page that a list goes on at, and at the bottom of a page that it goes on from
    const nameLists = new WeakMap();                         // the part of a list -> its names per page (0: one page)

    const listHtml = new WeakMap();                          // the part of a list on a roll -> its names as they were before the columns (one name to a line)

    // paged is true on a page of Letter paper. A roll gets the names as boxes too, for a gift list (perPage > 0): rollColumns sets them in two columns when every name fits half the width,
    // and puts the plain list back when one does not (so a roll with long names prints what it printed before).
    function fillList(div, list, paged, html) {
        div.classList.add('names');
        const perPage = list.perPage > 0 ? list.perPage : 0;
        if (!paged) listHtml.set(div, String(html ?? ''));
        const limit = paged && perPage ? perPage * MAX_NAME_PAGES : Infinity;
        let items = list.items.slice(), tail = list.tail || null;
        if (items.length + (tail ? 1 : 0) > limit) {
            const hidden = items.length - (limit - 1);
            items = items.slice(0, limit - 1);
            tail = '…and ' + esc(String(Math.min(hidden + (Number(list.more) > 0 ? Math.floor(Number(list.more)) : 0), 1000000000))) + ' more';
        }
        const page = document.createElement('div');
        page.className = 'names-page';
        const add = (html, cls) => { const s = document.createElement('span'); s.className = cls; s.innerHTML = html; page.appendChild(s); };
        for (const item of items) add(item, 'nm');
        if (tail) add(tail, 'nm tail');
        div.appendChild(page);
        nameLists.set(div, perPage);
    }

    // A gift list on a roll (80 mm or 58 mm): two columns when every name fits in half the width on one line, else the plain list of one name to a line, as it always was. Names are
    // the handler's own, cleaned and escaped; the width test is made on the page, with the fonts of the receipt.
    function rollColumns(div) {
        const page = div.firstElementChild, names = page ? Array.from(page.children) : [];
        const plain = () => { div.classList.remove('names'); div.innerHTML = listHtml.get(div) || ''; };
        if (names.length < 2) { plain(); return; }
        page.style.setProperty('--pb-cols', '2');
        const probe = document.createElement('span');
        probe.className = 'nm'; probe.textContent = 'x';
        page.appendChild(probe);
        const line = probe.getBoundingClientRect().height;
        page.removeChild(probe);
        for (const n of names) if (n.getBoundingClientRect().height > line * 1.5) { plain(); return; }
    }

    // Sets the list in the plainest columns that fit and returns the number of pages it takes. The first page holds what fits under the header (at most the names for a page, fewer when
    // the header leaves little room), the next pages are the full page and start at the top of their page (a spacer above each), the last page has to hold the footer as well.
    function fitNames(div, opts) {
        const pageH = pageHeightPx(opts);
        const container = $('receipt-container');
        const first = div.firstElementChild;
        const all = Array.from(first.children);
        const perPage = nameLists.get(div) || 0;
        const large = largeLayoutPx(opts) !== null;
        const top = (el) => el.getBoundingClientRect().top + window.scrollY;
        const bottom = (el) => el.getBoundingClientRect().bottom + window.scrollY;
        const docHeight = () => Math.ceil(document.documentElement.getBoundingClientRect().height);
        // 3.0.2, large layout: the platform logo is at the bottom of every page, so a page that the list goes on from keeps the room that the footer takes on the last page (the footer and what is
        // under it: the padding of the receipt). Measured here, before any name is moved: it is the distance between the top of the footer and the bottom of the receipt, whatever the page.
        const footerRoom = large && logoShown() ? Math.max(0, Math.ceil(container.getBoundingClientRect().bottom - $('receipt-footer').getBoundingClientRect().top)) : 0;
        const applyStep = (wrap, step) => {
            wrap.style.setProperty('--pb-cols', String(step[0]));
            wrap.style.setProperty('--pb-name-scale', String(step[1]));
            wrap.style.setProperty('--pb-name-lh', step[2]);
        };
        let lastStep = 0;                                 // the step the last trial left on
        // `count` names from `from` on page k, in `wrap`, tried from step number `startAt` on (to step `endAt`, the densest by default): the index of the first step that fits (the largest type that
        // does), or -1 when none does (the last step tried is left on). With onlyDensest only the densest step is tried: a cheap question, "can this many names fit at all?"
        const trial = (wrap, from, count, k, onlyDensest, startAt, endAt) => {
            wrap.replaceChildren(...all.slice(from, from + count));
            const last = from + count === all.length;
            if (k > 1) { wrap.style.marginTop = '0px'; wrap.style.marginTop = Math.max(0, (k - 1) * pageH + NAME_PAGE_PAD - top(wrap)) + 'px'; }
            if (large) container.style.minHeight = last ? (k * pageH) + 'px' : '';
            const end = endAt === undefined ? NAME_STEPS.length - 1 : endAt;
            for (let i = onlyDensest ? NAME_STEPS.length - 1 : (startAt || 0); i <= end; i++) {
                applyStep(wrap, NAME_STEPS[i]);
                lastStep = i;
                if (last ? docHeight() <= k * pageH : bottom(wrap) <= k * pageH - NAME_PAGE_RESERVE - footerRoom) return i;
            }
            return -1;
        };
        // the most names (of `want`) that fit on page k, with the layout of that answer left on
        const largest = (wrap, from, want, k) => {
            if (trial(wrap, from, want, k) >= 0) return want;
            let lo = 0, hi = want - 1;
            while (lo < hi) { const mid = Math.ceil((lo + hi) / 2); if (trial(wrap, from, mid, k, true) >= 0) lo = mid; else hi = mid - 1; }
            lo = Math.max(1, lo);
            trial(wrap, from, lo, k);
            return lo;
        };
        // the most names (of `want`) that fit on page k at this one step, with the layout of that answer left on (at least one)
        const largestAt = (wrap, from, want, k, step) => {
            if (trial(wrap, from, want, k, false, step, step) >= 0) return want;
            let lo = 0, hi = want - 1;
            while (lo < hi) { const mid = Math.ceil((lo + hi) / 2); if (trial(wrap, from, mid, k, false, step, step) >= 0) lo = mid; else hi = mid - 1; }
            lo = Math.max(1, lo);
            trial(wrap, from, lo, k, false, step, step);
            return lo;
        };
        const placed = [];                                // every page of the list: its box, its names, its page number and the step it was given
        let used, pages = 1;
        if (perPage) used = largest(first, 0, Math.min(all.length, perPage), 1);
        else { trial(first, 0, all.length, 1); used = all.length; }
        placed.push({ wrap: first, from: 0, count: used, k: 1, step: lastStep });
        // 3.0.2, large layout: the first page holds the names that fit under its header, and the pages after it have no header, so they hold as many as fit at the same type and the same columns
        // (the owner saw a lot of empty paper under the names of every page after the first). The step of the first page is tried first. When a page after it cannot hold a page's worth of names at
        // that step (its names are longer, so more of them wrap), the next denser step is tried, and so on: the whole list keeps one type and one number of columns, and every page that goes on is full.
        // Only when no step does it, the layout below is the answer, which gives every page the room it needs.
        const fillPages = (firstCount) => {
            const extra = [];
            const undo = () => { for (const wrap of extra) if (wrap.parentNode === div) div.removeChild(wrap); extra.length = 0; };
            for (let step = placed[0].step; step < NAME_STEPS.length; step++) {
                undo();                                                              // no page of an earlier try stays: it would stand in the way of the height of the last one
                if (trial(first, 0, firstCount, 1, false, step, step) < 0) continue;          // the first page has to hold its names at this step too
                let at = firstCount, k = 1, good = true;
                while (at < all.length) {
                    k++;
                    const wrap = document.createElement('div');
                    wrap.className = 'names-page';
                    div.appendChild(wrap);
                    extra.push(wrap);
                    const need = Math.min(perPage, all.length - at);
                    if (trial(wrap, at, need, k, false, step, step) < 0) { good = false; break; }       // a cheap question first: does a page's worth fit?
                    const n = largestAt(wrap, at, all.length - at, k, step);
                    if (n < need) { good = false; break; }
                    at += n;
                }
                if (good) return k;
            }
            undo();
            return 0;
        };
        if (large && perPage && used < all.length) {
            const laidOut = fillPages(used);
            if (laidOut) return laidOut;
            trial(first, 0, used, 1);                                                // the first page as it was
        }
        while (used < all.length) {
            pages++;
            const wrap = document.createElement('div');
            wrap.className = 'names-page';
            div.appendChild(wrap);
            const from = used, n = largest(wrap, from, Math.min(perPage, all.length - from), pages);
            used += n;
            placed.push({ wrap, from, count: n, k: pages, step: lastStep });
        }
        // One type size for the whole list: the pages that had room for more get the size of the one that had the least (its columns still fit each page). Every page is laid out again in order,
        // because a page that got smaller moves the start of the next one.
        if (placed.length > 1) {
            const size = Math.min(...placed.map(p => NAME_STEPS[p.step][1]));
            const firstOfSize = NAME_STEPS.findIndex(s => s[1] <= size);
            for (const p of placed) {
                const own = NAME_STEPS[p.step][1] <= size ? p.step : firstOfSize;
                if (trial(p.wrap, p.from, p.count, p.k, false, own) < 0) { applyStep(p.wrap, NAME_STEPS[p.step]); trial(p.wrap, p.from, p.count, p.k, false, p.step); }
            }
        }
        return pages;
    }

    // true while the receipt shows its platform logo (the picture of the footer)
    function logoShown() {
        const icon = $('receipt-icon');
        return !!icon.getAttribute('src') && getComputedStyle(icon).display !== 'none' && icon.getBoundingClientRect().height > 0;
    }

    // 3.0.2, large layout: the platform logo is at the bottom of every page of a list that takes more than one, in the place it has on the last page (the one of the footer). The others are
    // copies of that picture, made here from the picture the page already holds (our own, never event data), put by pixel in the receipt, which is the box they are placed in (receipt.css), and
    // below the content, so they are no picture of the message. Each is one page above the one under it. They go when the next receipt is built (applyLayout).
    async function addPageLogos(pages, opts) {
        const pageH = pageHeightPx(opts), container = $('receipt-container'), icon = $('receipt-icon');
        if (pages < 2 || pageH === null || largeLayoutPx(opts) === null || !logoShown()) return;
        const box = container.getBoundingClientRect(), r = icon.getBoundingClientRect(), made = [];
        for (let k = 1; k < pages; k++) {
            const img = document.createElement('img');
            img.className = 'page-logo';
            img.setAttribute('alt', '');
            img.referrerPolicy = 'no-referrer';
            img.src = icon.getAttribute('src');
            img.style.left = (r.left - box.left) + 'px';
            img.style.top = (r.top - box.top - (pages - k) * pageH) + 'px';
            img.style.width = r.width + 'px';
            img.style.height = r.height + 'px';
            container.appendChild(img);
            made.push(img);
        }
        await withTimeout(Promise.all(made.map(img => img.decode().then(() => true, () => false))), 1000);
    }

    // true when the image has loaded and decoded, false when it failed or `ms` ran out first
    function waitImage(img, ms) {
        return withTimeout(img.decode().then(() => true, () => false), ms).then(ok => ok === true);
    }

    // Waits for the avatar's picture. When the larger picture is on the page (largerAvatarUrl) it gets VARIANT_WAIT_MS, and if it does not come (or comes as a placeholder of a few pixels)
    // the picture the page was given takes its place and gets what is left of AVATAR_IMAGE_WAIT_MS (at least half a second). The receipt waits about as long as it ever did: a larger
    // picture that is missing costs one failed request, and one that hangs costs VARIANT_WAIT_MS inside the old limit.
    async function waitAvatar(url) {
        const avatar = $('receipt-avatar'), shown = avatar.getAttribute('src');
        if (!shown || shown === url) return waitImage(avatar, AVATAR_IMAGE_WAIT_MS);
        const started = Date.now();
        if (await waitImage(avatar, VARIANT_WAIT_MS) && avatar.naturalWidth >= VARIANT_MIN_PX && avatar.naturalHeight >= VARIANT_MIN_PX) { variantCame(shown); return true; }
        variantMissed(shown);
        pinImage(url);
        avatar.src = url;
        return waitImage(avatar, Math.max(500, AVATAR_IMAGE_WAIT_MS - (Date.now() - started)));
    }

    // Waits for what the screenshot needs. The avatar gets its own budget, and the other images (emotes in a High Roller message, the
    // platform logo) and the fonts get another. They all run side by side, so a stalled emote can't use up the avatar's time or the other way round.
    // An image that fails or runs out of time is remembered (badImages) so it never holds up a later print. An avatar that
    // didn't make it is hidden, so there is no bordered empty circle. The pinned copy keeps loading, so a slow image is there next time.
    async function settle(avatarUrl) {
        const avatar = $('receipt-avatar');
        const jobs = [];
        if (avatarUrl) {
            jobs.push(waitAvatar(avatarUrl).then(async (ok) => {
                if (ok) return;
                if (avatarUrl !== NO_PICTURE) markBad(avatarUrl);
                if (avatarStandIn && avatarUrl !== NO_PICTURE) {                  // a YouTube picture that did not come: the stand-in, like a receipt with no picture
                    avatar.style.borderRadius = '';
                    avatar.src = NO_PICTURE;
                    if (await waitImage(avatar, EMOTE_WAIT_MS)) return;
                }
                avatar.removeAttribute('src');
                avatar.style.display = 'none';
                $('receipt-container').classList.add('no-avatar');
                clearGaps();                                                     // with no picture the gaps are what they always were
            }));
        }
        for (const img of Array.from(document.images)) {
            const src = img.getAttribute('src');
            if (img === avatar || !src) continue;
            if (img.classList.contains('msg-image')) {                          // a picture of a viewer's message (an image site): not on time, not a picture or far too big = off the page
                jobs.push(waitImage(img, EMOTE_WAIT_MS).then((ok) => {
                    if (!ok) { markBad(src); dropMessageImage(img); }
                    else if (img.naturalWidth * img.naturalHeight > MAX_MESSAGE_IMAGE_PIXELS) { markBad(src); dropMessageImage(img, 'image too large'); }
                }));
                continue;
            }
            jobs.push(waitImage(img, EMOTE_WAIT_MS).then((ok) => { if (!ok && /^https:/i.test(src)) markBad(src); }));
        }
        jobs.push(withTimeout(document.fonts.ready, EMOTE_WAIT_MS));
        await Promise.all(jobs);
    }

    // Final check for viewer images: whatever the CSS did, an image that ended up bigger than MAX_VIEWER_IMAGE_PX (with room for a tilt)
    // on the finished page is not shown. (A scaled-up parent element is the one thing the per-image limits can't see.)
    function enforceImageLimit() {
        const images = $('receipt-content').querySelectorAll('img');
        if (!images.length) return;
        const limit = MAX_VIEWER_IMAGE_PX * 1.6;
        for (const img of images) {
            if (img.classList.contains('msg-image')) continue;                  // a picture of a message has its own limits (the width of the paper, MAX_MESSAGE_IMAGE_INCHES), set where it is made
            const r = img.getBoundingClientRect();
            if (r.width > limit || r.height > limit) { img.style.setProperty('display', 'none', 'important'); securityNotes.add('image too large'); }
        }
    }

    // Puts the page at rest between receipts (the C# side asks for it once the receipts of an event are delivered): the pictures lose their sources and the text slots
    // are emptied, so nothing an event brought, an animated emote say, keeps the hidden browser drawing while nothing prints. The model stays, so again() can show the
    // receipt once more, and show() rebuilds every slot from it.
    // Returns true, or 2 when a picture of an image site was on the page since the last rest: a viewer chose that picture, so the action also empties the browser's cache
    // (Edge keeps the files it loads in its profile folder, like any browser) and nothing of it stays on the disk.
    function rest() {
        const hadPicture = pictureShown;
        pictureShown = false;
        const avatar = $('receipt-avatar'), icon = $('receipt-icon');
        if (avatar) avatar.removeAttribute('src');
        if (icon) icon.removeAttribute('src');
        for (const id of ['receipt-title', 'receipt-subtitle', 'receipt-content', 'receipt-banner', 'receipt-tail']) { const el = $(id); if (el) el.textContent = ''; }
        for (const logo of Array.from(document.querySelectorAll('#receipt-container > .page-logo'))) logo.remove();       // the logos of the pages of a long list (addPageLogos)
        for (const el of Array.from(document.querySelectorAll('#receipt-sticker-pictures, #receipt-card-pictures, #receipt-kind'))) el.remove();  // the pictures and the kind of a sticker (3.2.0, stickerArrange)
        testMark(null);                                                       // and the TEST line of a test print with typed values
        return hadPicture ? 2 : true;
    }

    async function render(data, options) {
        let sample = false;
        if (data && data.__source === 'TestSample') {
            sample = true;
            const name = data.sample;
            const step = HYPE_STEPS.findIndex(x => x.name === name);
            if (data.event && typeof data.event === 'object' && !Array.isArray(data.event)) data = data.event;      // 3.0.4: the values the person typed in the dock
            else if (step >= 0) data = hypeSampleStep(step);                       // a Hype Train test print: the event of that step, with the test train brought up to it
            else {
                data = own(SAMPLES, name) ? SAMPLES[name] : SAMPLES.TwitchSub;
                // the long-message sample has to be a High Roller cheer, whatever the threshold is set to
                if (name === 'TwitchCheerLong' && options && options.highRollerBits > data.bits) data = Object.assign({}, data, { bits: options.highRollerBits });
            }
        }
        const handler = data && own(HANDLERS, data.__source) ? HANDLERS[data.__source] : null;      // an inherited name such as 'constructor' finds no layout
        if (!handler) return { ok: false, reason: 'no layout for event type "' + (data && data.__source) + '"' };

        hype = sample ? hypeTest : hypeLive;                                  // a test print never touches the tally of a real train
        if (!sample && data.__source === 'TwitchCheer') hypeObserveCheer(data);       // while a train is on, a cheer counts toward its tally
        securityNotes.clear();
        const opts = options || {};
        const model = await handler(data, opts);
        lastModel = model || null;                                            // again() shows it once more
        if (!model) return { ok: false, reason: 'skipped' };
        return present(model, opts);
    }

    // The receipt that render() built last. The action asks for it once more when the event goes to a printer with another paper width: the
    // handler has done its work for the event (a cheer is counted, a Hype Train moved on), and only the layout has to run again.
    let lastModel = null;

    async function again(options) {
        if (!lastModel) return { ok: false, reason: 'no receipt to show again' };
        securityNotes.clear();
        return present(lastModel, options || {});
    }

    // 3.0.5 (the owner's rule, 15 Oct 2026): a printer set to Large message gives the large layout only to a cheer of at least the High Roller bits, a Super Chat that reached the YouTube
    // High Roller amount, and the gift subscriptions of Twitch, YouTube and Kick (their names keep the columns of the large layout). The value counts, not the printer's switch: a big cheer on
    // a printer that does not allow High Roller prints still gets the large page, with its plain message. Every other receipt prints as a printer set to Scaled prints it. Only a handler
    // sets largePage, so event data cannot ask for the large layout.
    function layoutFor(model, opts) {
        if (!opts) return opts;
        // 3.2.0: the sticker layout is for a High Roller message that prints as one on this printer (viewOf: styled); every other receipt is the receipt of an 80 mm roll made as wide as
        // the tape (3.2.0-beta.9, stickerFit; until then it printed as on a roll as narrow as the tape). The sticker's inch is the roll's (96 CSS px), so every other option stays.
        if (opts.layout === 'sticker') {
            if (viewOf(model, opts).styled === true) return opts;
            const roll = Object.assign({}, opts);
            roll.layout = 'stickerfit';
            return roll;
        }
        // 3.2.0-beta.2: on a card of 4 x 6 in a High Roller message gets the card layout; every other receipt is the receipt of an 80 mm roll, drawn with the roll's options (its inch, no
        // page) and made as large as the card allows (cardFit), the card's height kept in cardPagePx
        if (opts.layout === 'card') {
            if (viewOf(model, opts).styled === true) return opts;
            const roll = Object.assign({}, opts);
            roll.layout = 'cardfit';
            roll.cardPagePx = pageHeightPx(opts);
            const inch = Number(opts.cardRollPxPerInch);
            roll.pxPerInch = Number.isFinite(inch) && inch >= 24 && inch <= 400 ? inch : PX_PER_INCH;
            delete roll.pageHeightPx;
            delete roll.imageFit;
            return roll;
        }
        if (opts.layout !== 'message' || model.largePage === true) return opts;
        const scaled = Object.assign({}, opts);
        delete scaled.layout;                                                     // (Image fit applies only with the large layout)
        return scaled;
    }

    // Builds the page from a model and reports how tall it is (the picture is taken by the action). The handler has run already, once per event.
    async function present(model, options) {
        const opts = layoutFor(model, options);
        const avatarUrl = show(model, opts);
        await settle(avatarUrl);
        enforceImageLimit();
        if (stickerLayoutOn(opts)) stickerPictures();                              // 3.2.0: the box of a sticker's pictures, now that they have loaded
        const card = cardLayoutOn(opts), cardFitted = cardFitOn(opts);             // 3.2.0-beta.2: a card of 4 x 6 in
        if (card) cardPictures();

        // Check whether the message is longer than its bits-per-inch limit (after images have loaded, since they change the height).
        // A cut message fades out at the bottom so it doesn't stop mid-line. The log says how much was left out.
        // "Longer" means the height the message takes up in the flow of the page, measured with the limit lifted. Rotated,
        // nudged or absolutely positioned bits that stick out of the box (but would fit once it's drawn) don't count as cut.
        let trimmed = null;
        const view = viewOf(model, opts);
        let limitBy = view.by;
        // A receipt on a page of Letter paper is one page, always (3.0.0): no message, no list (gifted subs, the items of an order) and no theme makes a second sheet. Where a roll prints a
        // message or a list as long as it comes, a sheet has an end: when the receipt reaches past the page, the excess is taken off the content box (which keeps at least an inch), and a
        // longer text fades out there like at any other limit. This is measured now, after the pictures have loaded, so the picture and the lines around the box count at the size they have.
        // In the layout of a roll scaled to the page the pictures give back what they can first (shrinkPictures), in the large layout they already have. The action holds a picture of a page to
        // one page as well (PbLetter), which is the wall for what this cannot reach, such as a theme that makes the header taller than the page.
        const box = $('receipt-content');
        const pagePx = card ? null : pageHeightPx(opts);                           // a card fits its words itself (cardWords, below)
        // A gift list is the one receipt that takes more than one page: names set in columns, up to NAMES_PER_PAGE to a page (fitNames). Its pages are the page limit below.
        const nameBox = box.querySelector(':scope > .part.names');
        const pages = nameBox && pagePx !== null ? fitNames(nameBox, opts) : 1;
        if (pages > 1) await addPageLogos(pages, opts);
        if (nameBox && pagePx === null) rollColumns(nameBox);
        let limited = !card && view.maxPx != null;
        // Only what a viewer wrote (a message, a list of names) is cut at the end of the page: its words are the part that can go. Every other receipt (a Hype Train, a subscription) has nothing
        // that may be cut, and is made smaller as a whole below if it is still too tall.
        const cuttable = view.styled || box.querySelector(':scope > .part.message') !== null || nameBox !== null;
        if (pagePx !== null && cuttable) {
            let over = Math.ceil(document.documentElement.getBoundingClientRect().height) - pagePx * pages;
            if (over > 0 && largeLayoutPx(opts) === null && shrinkPictures(over, opts)) over = Math.ceil(document.documentElement.getBoundingClientRect().height) - pagePx * pages;
            if (over > 0) {
                const cs = getComputedStyle(box);
                // max-height does not count the padding and the border of a box that is not border-box (receipt.css has none, a theme can add them)
                const frame = cs.boxSizing === 'border-box' ? 0 : ['paddingTop', 'paddingBottom', 'borderTopWidth', 'borderBottomWidth'].reduce((sum, k) => sum + (parseFloat(cs[k]) || 0), 0);
                const want = Math.max(Math.floor(box.getBoundingClientRect().height - frame - over), Math.floor(pxPerInch(opts)));
                if (!(want >= parseFloat(cs.maxHeight))) {                      // a limit is only ever tightened (NaN: the box has none)
                    box.style.setProperty('max-height', want + 'px', 'important');
                    limited = true; limitBy = 'page';
                }
            }
        }
        if (limited) {
            const box = $('receipt-content');
            const shown = box.getBoundingClientRect().height;
            const limit = box.style.getPropertyValue('max-height');
            let full;
            try {
                box.style.setProperty('max-height', 'none', 'important');
                box.style.setProperty('height', 'auto', 'important');       // a theme that fixes the box's height must not count as message length
                full = box.getBoundingClientRect().height;
            } finally {
                box.style.setProperty('max-height', limit, 'important');
                box.style.removeProperty('height');
            }
            if (full > shown + 1) {
                box.classList.add('cut');
                // 3.0.0: in the large layout a box with pictures is cut in its words (receipt.css lets them shrink): the parts that are clipped fade at their own bottom edge, and the box does not,
                // because the fade of the box would land on the last picture. When no part of words is clipped (the pictures themselves are what does not fit) the fade of the box stays.
                if (largeLayoutPx(opts) !== null && box.querySelector(':scope > .part.pictures')) {
                    let clipped = false;
                    for (const part of Array.from(box.children)) if (!part.classList.contains('pictures') && part.scrollHeight > part.clientHeight + 1) { part.classList.add('clipped'); clipped = true; }
                    if (clipped) box.classList.remove('cut');
                }
                const inches = (px) => Math.round(px / pxPerInch(opts) * 100) / 100;
                trimmed = { limitIn: inches(shown), fullIn: inches(full), by: limitBy === 'cap' || limitBy === 'page' || limitBy === 'amount' ? limitBy : 'bits' };
            }
        }

        if (card) trimmed = cardWords(opts, view.maxPx != null ? view.by : null);

        // What no cut can reach (a Hype Train receipt: its drawing, its picture and its lists are all there is) is made smaller as a whole, to the same proportions, until it is the
        // pages it has: a receipt on Letter paper is one page and is never chopped in the middle of a picture. Only the picture changes, nothing of the receipt is left out.
        let fitted = 0, fitHeight = 0;
        if (pagePx !== null) {
            const want = pagePx * pages, have = Math.ceil(document.documentElement.getBoundingClientRect().height);
            if (have > want) {
                const share = Math.max(MIN_PAGE_FIT, want / have), container = $('receipt-container');
                container.style.transformOrigin = 'top center';
                container.style.transform = 'scale(' + share + ')';
                fitted = Math.round(share * 100);
                fitHeight = share > want / have ? have * share : want;          // (below MIN_PAGE_FIT the receipt is still taller than its page: the action cuts what is left)
            }
        }

        if (cardFitted) fitted = cardFit(opts);
        const stickerHeight = stickerFitOn(opts) ? stickerFit() : 0;               // 3.2.0-beta.9: the receipt of an 80 mm roll made as wide as the tape, and the length it has then
        const fresh = {};
        for (const k of Object.keys(avatarFresh)) { fresh[k] = avatarFresh[k]; delete avatarFresh[k]; }
        // A gift list or an order's item list reports the real page height. The action photographs a page taller than its window in tiles.
        // Every other receipt is cut at MAX_RECEIPT_HEIGHT.
        const cardHeight = card ? Math.floor(pageHeightPx(opts)) : cardFitted ? Math.floor(opts.cardPagePx) : 0;          // a card is always one card high
        const pageHeight = cardHeight > 0 ? cardHeight : stickerHeight > 0 ? stickerHeight : fitted ? Math.ceil(fitHeight) : Math.ceil(document.documentElement.getBoundingClientRect().height);
        const longList = cardHeight === 0 && $('receipt-content').classList.contains('roomy');
        return {
            ok: true, avatars: fresh, trimmed,
            height: longList ? pageHeight : Math.min(MAX_RECEIPT_HEIGHT, pageHeight),
            fit: fitted || undefined,                                  // the share of its size a receipt was made smaller to (percent), when it was
            pages, pageBreaks: Array.from({ length: pages - 1 }, (_, i) => pagePx * (i + 1)),       // a page of Letter paper that goes on (a long gift list): where the next page starts, in CSS px
            security: Array.from(securityNotes).slice(0, 10),      // what was removed from this receipt (the log reports it)
            photos: photoRects(),
        };
    }

    // Where the pictures are on the page, in CSS px: [[x, y, width, height], ...]. The viewer's picture and the images of a message count (a cheermote, an emote). The platform logo and
    // the drawings of a Hype Train are no pictures: they have flat black and white and print crisp. A message with more than PHOTO_RECT_MAX images is given as one box, the whole message.
    // Never throws: a receipt is not lost for lack of this list.
    const PHOTO_RECT_MAX = 24;
    function photoRects() {
        const out = [];
        try {
            const add = (el) => {
                const r = el.getBoundingClientRect();
                const x = Math.floor(r.left + window.scrollX), y = Math.floor(r.top + window.scrollY), x2 = Math.ceil(r.right + window.scrollX), y2 = Math.ceil(r.bottom + window.scrollY);
                if (Number.isFinite(x + y + x2 + y2) && x2 > x && y2 > y) out.push([x, y, x2 - x, y2 - y]);
            };
            const avatar = $('receipt-avatar');
            if (avatar.getAttribute('src') && avatar.style.display !== 'none' && getComputedStyle(avatar).display !== 'none') add(avatar);
            // 3.2.0-beta.8: a card and a sticker move the pictures of the message into a box of their own after the content (cardArrange, stickerArrange), so the boxes
            // are read as well; before, a black and white card printed its pictures without the picture style (the audit of 19 October)
            const boxes = ['receipt-content', 'receipt-card-pictures', 'receipt-sticker-pictures'].map(id => $(id)).filter(el => el);
            const images = [];
            for (const box of boxes) for (const img of Array.from(box.querySelectorAll('img'))) if (img.getAttribute('src') && getComputedStyle(img).display !== 'none') images.push(img);
            if (images.length > PHOTO_RECT_MAX) boxes.forEach(add);
            else images.forEach(add);
        } catch (e) { /* no list: the action then treats the whole picture as one */ }
        return out;
    }

    function setTheme(css) { $('theme').textContent = css || ''; }

    // For tests only: pure functions and plain numbers. Nothing here reaches the DOM or the network.
    const internals = {
        hostMatches,
        checkAvatarUrl: (value) => vetUrl(value, AVATAR_HOSTS).url,
        checkImageUrl: trustedImageUrl,
        avatarHosts: () => AVATAR_HOSTS.slice(),
        emoteHosts: () => TRUSTED_IMAGE_HOSTS.slice(),
        largeLayoutPx: (opts) => largeLayoutPx(opts),
        imageFitOf: (opts) => imageFitOf(opts),
        imageSites: () => JSON.parse(JSON.stringify(IMAGE_SITES)),
        imagePathIds: () => Object.keys(IMAGE_PATHS),
        imageSiteLink: (raw, ids, lookups) => imageSiteLink(raw, new Set(Array.isArray(ids) ? ids : []), lookupsOf(lookups)),
        // 3.0.11: what the page makes of an Imgur address: { direct } (one picture), { album } (needs the action's lookup) or null; the action's own reading must agree (PbImgur)
        imgurLink: (raw) => { try { const u = new URL(String(raw)); return /^https:\/\//i.test(String(raw).trim()) && u.protocol === 'https:' && !u.username && !u.password && !u.port ? imgurLink(u.hostname, u.pathname) : null; } catch { return null; } },
        // 3.1.0: the same for Catbox and ImgBB: { direct }, { album } (Catbox, ImgBB), { page } (ImgBB) or null; the action's own reading must agree (PbCatbox, PbImgbb)
        catboxLink: (raw) => { try { const u = new URL(String(raw)); return /^https:\/\//i.test(String(raw).trim()) && u.protocol === 'https:' && !u.username && !u.password && !u.port ? catboxLink(u.hostname, u.pathname) : null; } catch { return null; } },
        imgbbLink: (raw) => { try { const u = new URL(String(raw)); return /^https:\/\//i.test(String(raw).trim()) && u.protocol === 'https:' && !u.username && !u.password && !u.port ? imgbbLink(u.hostname, u.pathname, u.searchParams.get('sort')) : null; } catch { return null; } },
        displayName, replaceLinks, formatDate,
        shareCuts, gapRooms: () => Object.assign({}, GAP_ROOM),
        largerAvatarUrl, variants: () => ({ misses: Array.from(variantMisses.entries()), lull: Array.from(variantLull.entries()) }),
        allowedCss: () => Array.from(ALLOWED_CSS),
        cached: (key) => { const e = avatarCache.get(key); return e ? { url: e.url, ts: e.ts } : null; },
        pinned: () => Array.from(pinnedImages.keys()),
        stats: () => ({ avatarCache: avatarCache.size, negative: avatarNegative.size, pending: avatarPending.size, badImages: badImages.size, pinned: pinnedImages.size }),
        hype: () => ({ live: hypeSummary(hypeLive), test: hypeSummary(hypeTest) }),
        hypeObserve: (d) => hypeObserveCheer(d),
        hypeForget: () => { for (const h of [hypeLive, hypeTest]) { hypeReset(h, '', 0, 0); h.active = false; h.stage = 0; } },
        // what the C# side holds of each sample for a test print that follows the rules (Routing.SampleEvent): the events of SAMPLES, and the event kind and level of each Hype Train step
        sampleEvents: () => JSON.parse(JSON.stringify(SAMPLES)),
        hypeStepEvents: () => HYPE_STEPS.map(x => ({ name: x.name, source: HYPE_SOURCES[x.kind], level: x.level })),
        fmtNum,
        limits: () => ({ AVATAR_LOOKUP_BUDGET_MS, AVATAR_BACKGROUND_TIMEOUT_MS, AVATAR_TTL_MS, AVATAR_STALE_MS, NEGATIVE_TTL_MS, NOT_FOUND_TTL_MS, AVATAR_IMAGE_WAIT_MS, EMOTE_WAIT_MS,
                         MAX_PINNED_IMAGES, MAX_NAME_CHARS, MAX_VARIANTS, MAX_VIEWER_IMAGE_PX, MAX_DATA_IMAGE_CHARS, MAX_MESSAGE_IMAGES, MAX_MESSAGE_IMAGE_INCHES, MAX_MESSAGE_IMAGE_PIXELS, MAX_MESSAGE_IMAGE_URL, VARIANT_PX, VARIANT_WAIT_MS, VARIANT_MIN_PX, VARIANT_LULL_AFTER, VARIANT_LULL_MS }),
    };

    return { version: VERSION, render, again, rest, setTheme, loadAvatarCache, clearAvatarCache, ready: true, violations: () => violationCount, violationLog: () => violationLog.slice(),
             eventTypes: Object.keys(HANDLERS), sampleNames: Object.keys(SAMPLES).concat(HYPE_STEPS.map(x => x.name)), internals };
})();
</script>
