<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- What this page may load and do. There are no inline scripts, styles or handlers anywhere, so the policy can be this strict.
         frame-src 'self' lets it show one dock page from this same web host and nothing else. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; frame-src 'self'; connect-src 'self' ws: wss:; base-uri 'none'; form-action 'none'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Printer Bot</title>
    <link rel="icon" href="assets/logo.png?v=e09a0508ea8a" type="image/png">

    <!-- The build tool rewrites the ?v= stamps. A changed file gets a new address, so a browser that caches hard still fetches it. -->
    <link rel="stylesheet" href="css/router.css?v=e09a0508ea8a" />
</head>

<body>
    <!-- A bar above the dock for an action that cannot update itself. js/router.js fills it in and shows it. -->
    <div id="router-banner" role="status" hidden>
        <p id="router-banner-text" class="router-banner-text"></p>
        <div class="router-banner-buttons">
            <button type="button" id="banner-show-button">Show how</button>
            <button type="button" id="banner-hide-button">Hide</button>
        </div>
    </div>

    <!-- Shown while the router works and when it cannot go on. The dock page itself is added to the body by js/router.js. -->
    <main id="router-view" class="loading">
        <img id="router-logo" class="router-logo" src="assets/logo.png?v=e09a0508ea8a" alt="" />
        <div id="router-title" class="router-title">Printer Bot</div>
        <p id="router-text" class="router-text" role="status">Loading…</p>
        <button type="button" id="retry-button" hidden>Retry</button>
    </main>

    <script src="vendor/streamerbot-client.js?v=e09a0508ea8a"></script>
    <script src="js/router.js?v=e09a0508ea8a"></script>
</body>

</html>
